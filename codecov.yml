# Codecov configuration for nlvegan/verenigingen
#
# Two upload sources, each tagged with a flag:
#   - python : merged backend coverage from the sharded bench run-parallel-tests
#              suite (.github/workflows/_base-server-tests.yml)
#   - jest   : frontend public/js coverage from `npm run test:coverage`
#              (.github/workflows/quality-assurance.yml)
#
# Statuses are informational for now (they post trends/comments but do NOT
# block merges). Flip `informational: false` and set real `target`s once the
# baselines are trusted.

codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        informational: true
      python:
        informational: true
        flags:
          - python
      jest:
        informational: true
        flags:
          - jest
    patch:
      default:
        informational: true

# Keep the production-coverage denominator honest. CI uploads frappe's
# run-parallel-tests coverage.xml, which (unlike the local .coveragerc) does NOT
# omit test_*-named helper modules that live co-located in the production tree
# (e.g. verenigingen_payments/mollie/utils/test_helpers.py). Mirror .coveragerc's
# test exclusions here so codecov drops them regardless of how the report was
# collected.
ignore:
  - "**/test_*.py"
  - "**/tests/**"
  # Dev / ops / diagnostic tooling invoked by hand (bench console, bench
  # execute, bench CLI) or gated to developer mode — never on the production
  # request or scheduler path, and not meaningfully unit-testable. Counting it
  # drags the production denominator down and hides real coverage, so excluding
  # it keeps the number honest.
  - "verenigingen/debug_coverage.py"           # dev-only coverage-analysis diagnostics; no importers
  - "verenigingen/utils/api_endpoint_optimizer.py"  # source rewriter; whitelisted endpoint is @development_only_api
  - "verenigingen/commands/**"                 # bench CLI commands (wired via the `commands` hook, not the request path)

flags:
  python:
    paths:
      - verenigingen/
    carryforward: true
  jest:
    paths:
      - verenigingen/public/js/
    carryforward: true

comment:
  layout: "header, flags, diff, files"
  require_changes: false
