# Pre-commit hooks for Verenigingen app
# Install with: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'
      - id: end-of-file-fixer
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'
      - id: check-docstring-first
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=110']
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'

  # Ruff replaces flake8 + isort (10-100x faster)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|.*test.*\.py|.*debug.*\.py|archived_.*)'

  # Pylint for deep static analysis (pre-push only, non-blocking on commit)
  - repo: https://github.com/PyCQA/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        stages: [pre-push]
        args: [
          '--rcfile=.pylintrc',
          '--fail-under=7.0',
          '--jobs=0',
          '--ignore-paths=archived_unused/.*,archived_deleted/.*,archived_removal/.*,archived_docs/.*'
        ]
        exclude: '^(node_modules|.git|dist|build|scripts|tests|debug_utils|dev_scripts|integration_tests|verenigingen/tests|frontend_tests|archived_unused|archived_deleted|archived_removal|archived_docs)/'

  # Security Validation (Optimized)
  - repo: local
    hooks:
      - id: bandit-focused
        name: 🔍 Security Linting (Bandit Focused - 3s runtime)
        description: Fast security scan focused on critical files
        entry: ./scripts/security/bandit-focused.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      # INAPPROPRIATE MOCK PREVENTION (PHASE 4 WEEK 3 ADDITION)
      - id: block-inappropriate-mocks
        name: 🚫 Block Inappropriate Mocks (Phase 4 Week 3)
        description: Prevent inappropriate business logic mocks based on systematic elimination strategy
        entry: python scripts/validation/archived/block_inappropriate_mocks.py
        language: system
        files: '^.*test.*\.py$|^.*/tests/.*\.py$'
        pass_filenames: true
        stages: [pre-commit, pre-push]
        verbose: true
        fail_fast: true

      # TEST QUALITY ENFORCEMENT (CRITICAL - MUST BE FIRST)
      - id: test-quality-enforcer
        name: 🚨 Test Quality Enforcer (CRITICAL)
        description: Block mock abuse and enforce real integration testing patterns
        entry: python scripts/validation/test_quality_enforcer.py
        language: system
        files: '^.*test.*\.py$|^.*/tests/.*\.py$'
        exclude: '^(.*debug.*|.*_debug\.py|.*utils/debug/.*\.py|scripts/.*|archived_.*)'
        pass_filenames: true
        stages: [pre-commit, pre-push]
        verbose: true
        fail_fast: true
      # Original validation hooks

      - id: doctype-field-validator
        name: DocType field attribute access validator
        entry: python scripts/validation/archived/doctype_field_validator.py --pre-commit --reduced-fp-mode
        language: system
        pass_filenames: true
        files: \.py$
        stages: [pre-commit]
        exclude: '^(tests/|test_|.*_test\.py|debug_|.*_debug\.py|scripts/testing/|scripts/debug/|test_field_validation_gaps\.py|archived_.*|archived_unused/|archived_deleted/)'

      - id: sql-field-validator
        name: SQL query field validation
        entry: python scripts/validation/production/sql_field_reference_validator.py --pre-commit
        language: system
        pass_filenames: true
        files: \.py$
        stages: [pre-commit]
        exclude: '^(tests/|test_|.*_test\.py|debug_|.*_debug\.py|scripts/testing/|scripts/debug/|archived_.*)'

      - id: frappe-api-validator
        name: Balanced field validation (practical mode)
        entry: python scripts/validation/archived/database_field_reference_validator.py --level balanced --pre-commit
        language: system
        pass_filenames: true
        files: \.py$
        stages: [pre-commit]
        exclude: '^(tests/|test_|.*_test\.py|debug_|.*_debug\.py|scripts/testing/|scripts/debug/|one-off-test-utils/|archived_.*|archived_unused/|archived_deleted/)'

      - id: enhanced-field-validator
        name: Context-aware field reference validator
        entry: python scripts/validation/enhanced_field_reference_validator.py
        language: system
        pass_filenames: true
        files: '\.(py|html|js)$'
        stages: [pre-push]
        exclude: '^(tests/|test_|.*_test\.py|debug_|.*_debug\.py|scripts/testing/|scripts/debug/|test_field_validation_gaps\.py|archived_.*|archived_unused/|archived_deleted/)'

      - id: template-field-validator
        name: HTML/JavaScript template field validation
        entry: python scripts/validation/production/template_field_validator.py
        language: system
        pass_filenames: true
        files: '\.(html|js)$'
        stages: [pre-commit]
        exclude: '^(tests/|test_|.*_test\.(html|js)|debug_|.*_debug\.(html|js)|scripts/testing/|scripts/debug/|frontend_tests/|node_modules/)'

      - id: javascript-doctype-validator
        name: JavaScript DocType field validation
        entry: python scripts/validation/production/javascript_doctype_field_validator.py
        language: system
        pass_filenames: true
        files: '\.js$'
        stages: [pre-push]
        exclude: '^(tests/|test_|.*_test\.js|debug_|.*_debug\.js|scripts/testing/|scripts/debug/|frontend_tests/|node_modules/)'

      - id: cache-guard-validator
        name: 🧪 Test-Isolation Cache-Guard (blocking)
        description: >-
          Flags shard-order-fragile permission/role reads placed BEFORE a user
          switch (frappe.set_user / self.as_user / self.as_role) in a test -- the
          stale-cache pre-check-guard pattern that flaked CI in 5caed9e8. Blocking
          (--strict): the corpus is clean, so any new occurrence fails the push. Fix
          by moving the read after the switch or deleting it if a post-switch
          assertion already proves it. Suppress a genuinely intentional case with a
          trailing '# cache-guard-ok: baseline-intentional|false-positive|relocated-elsewhere'.
        entry: python scripts/validation/cache_guard_validator.py --strict
        language: system
        pass_filenames: true
        # Covers both test_*.py and *_test.py test modules.
        files: '(^|/)(test_.*|.*_test)\.py$'
        stages: [pre-push]
        # verbose: surface findings even on the rare passing run for visibility.
        verbose: true
        exclude: '^(scripts/validation/tests/|archived_.*|archived_unused/|archived_deleted/)'

      - id: db-begin-validator
        name: 🔁 Implicit-commit guard (frappe.db.begin / raw TRUNCATE) [advisory]
        description: >-
          Flags frappe.db.begin() and raw frappe.db.sql("TRUNCATE ...") in production
          code. START TRANSACTION raises ImplicitCommitError once the request has
          written anything (a save, a set_value, a File insert, even frappe.log_error),
          and callers that swallow the exception turn it into a silent permanent
          failure -- this broke four call sites (2026-07-26 audit). Fix by DELETING
          begin() and keeping the SELECT ... FOR UPDATE plus the existing
          commit()/rollback(); do NOT convert to a savepoint, which does not release
          row locks. Advisory while the 16-site inventory is triaged; flip to --strict
          once it is annotated. Suppress a justified site with a trailing
          '# db-begin-ok: own-connection|patch-context|verified-clean-caller|false-positive'.
        entry: python scripts/validation/db_begin_validator.py
        language: system
        pass_filenames: true
        files: '\.py$'
        stages: [pre-push]
        # verbose: pre-commit hides stdout for passing hooks, and this one passes
        # (advisory) even when it has findings -- without this they are invisible.
        verbose: true
        exclude: '^(scripts/validation/tests/|archived_.*|archived_unused/|archived_deleted/)'

      - id: eslint
        name: 🔧 ESLint JavaScript validation
        # Check-only: report lint problems on the *staged* files and fail the
        # commit; the dev fixes them. The trailing `--` makes $0='--' so "$@"
        # is the real staged filenames (without it pre-commit's first filename
        # is consumed as $0, and a single staged file leaves "$@" empty ->
        # eslint would lint the whole tree). No `--fix` (avoids piecemeal
        # reformat churn) and no trailing echo (so the hook's exit code is
        # eslint's, instead of always 0).
        entry: scripts/testing/with-node-modules.sh bash -c 'eslint --max-warnings=1000 "$@"' --
        language: system
        files: \.js$
        stages: [pre-commit]
        exclude: '^(node_modules/|archived_unused/|archived_deleted/|scripts/analysis/|scripts/monitoring/|scripts/performance/|scripts/rollback/|scripts/security/|debug_utils/|dev_scripts/)|\.min\.js$|\.bundle\.js$'

      - id: prettier
        name: 🎨 Prettier formatting check (JS/Vue)
        # Check-only on the *staged* JS/Vue files: fail the commit if any are not
        # Prettier-formatted (dev runs `npm run format` to fix). Prettier owns
        # formatting now (eslint-config-prettier disables the stylistic ESLint
        # rules). Same `--` sentinel trick as the eslint hook: $0='--' so the
        # staged filenames land in "$@" (not $0); a lone staged file would
        # otherwise leave "$@" empty and Prettier would scan nothing.
        # `--check` respects .prettierignore, so ignored paths are skipped.
        entry: scripts/testing/with-node-modules.sh bash -c 'prettier --check "$@"' --
        language: system
        files: \.(js|vue)$
        stages: [pre-commit]
        exclude: '^(node_modules/|archived_unused/|archived_deleted/|scripts/analysis/|scripts/monitoring/|scripts/performance/|scripts/rollback/|scripts/security/|debug_utils/|dev_scripts/)|\.min\.js$|\.bundle\.js$'

      - id: fast-method-validator
        name: Method call validation
        entry: python scripts/validation/archived/method_resolution_validator.py
        language: system
        pass_filenames: true
        files: '\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/testing/|scripts/debug/|test_field_validation_gaps\.py|.*_test\.py|debug_.*\.py)'

      - id: import-path-validator
        name: 🔍 Import Path Validation
        description: Validates that Python import statements reference modules that actually exist
        entry: python scripts/validation/import_path_validator.py --quick
        language: system
        pass_filenames: true
        files: '\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/testing/|scripts/debug/|scripts/validation/archived/|.*_test\.py|debug_.*\.py)'
        fail_fast: true

      - id: except-order-validator
        name: 🔀 Except-Clause Order (post-PR-#107)
        description: Catches `except frappe.ValidationError` before `except frappe.PermissionError` in the same try block — shadows our multi-inherited verenigingen.utils.error_handling.PermissionError
        entry: python scripts/validation/except_order_validator.py
        language: system
        pass_filenames: true
        files: '\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/testing/|scripts/debug/|scripts/validation/archived/)'

      - id: error-swallow-validator
        name: 🕳️  Swallowed-Exception Guard (ratchet)
        description: >-
          Blocks NEW broad `except` handlers that only log and return a falsy value
          from a function that elsewhere returns a real value -- or ASSIGNS nothing
          but falsy values instead of returning one (#601), when the handler sets
          nothing else. The caller then cannot tell failure from "legitimately
          nothing", and on CI the real error dies with the database. This repo has
          been bitten repeatedly: board members got org-wide project access when a
          permission hook returned "" (read as UNRESTRICTED, PR #191); a swallowed DB
          error in the volunteer duplicate guard inserted SECOND Volunteers; and a CI
          failure in test_chapter_members_enhanced was undiagnosable because the only
          copy of the cause died with the job.
          Ratcheted against scripts/validation/error_swallow_baseline.txt (480 known
          sites) so existing code does not block commits — the baseline should only
          ever shrink, and `--check-shrink` now makes each shrink say WHY it shrank.
          Mark deliberate cases `# swallow-ok: best-effort`.
          This hook only sees the files you touched; the Code Validation workflow
          re-runs it over the whole tree, so `git commit -n` no longer bypasses it.
          The exclude below must stay a SUBSET of SCAN_ROOTS in the validator —
          anything scanned here but absent from the baseline fails on first edit.
        entry: python scripts/validation/error_swallow_validator.py
        language: system
        pass_filenames: true
        files: '\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/validation/archived/|verenigingen/tests/)'

      - id: doctype-name-validator
        name: 🏷️  Unknown DocType Name Guard (ratchet)
        description: >-
          Blocks a NEW string literal in a doctype-name position naming something that
          is not a DocType in any app on this bench. Nothing in the framework says so
          for you: `frappe.db.exists` routes through `sql(..., ignore=True)`, swallows
          the missing-table 1146 and returns None — the same answer as "no such row" —
          while `get_value` / `set_value` / `count` raise into whichever broad `except`
          is nearest. That is how a permission gate in the Chapter Members report
          spelled the ROLE name "Verenigingen Chapter Board Member" instead of the
          DocType "Chapter Board Member" and denied every chapter board member for
          nine months (#677), and how TestDataBuilder registered cleanups under two
          doctypes that do not exist and leaked every Volunteer it created (#491).
          Also covers this app's own cleanup registries (`track_doc`, `register`,
          `add_cleanup_record`) — where #491 actually lived, and where no
          `frappe.`-shaped grep would have looked. Ratcheted against
          scripts/validation/doctype_name_baseline.txt (93 known sites, mostly
          aspirational doctypes in tests) so existing code does not block commits;
          only a NEW name, or a new occurrence in a file already listed, fails.
          A deliberate unknown name — a negative test — is marked
          `# doctype-ok: <reason>`, and probing with `frappe.db.exists("DocType", X)`
          first exempts X in that file.
          This hook only sees the files you touched. Unlike its siblings there is
          deliberately NO Code Validation job: that workflow checks this app out
          standalone, where the authority would hold only Verenigingen's own
          doctypes and the gate would flag `frappe.get_doc("User", ...)`. Whole-tree
          enforcement is verenigingen/tests/test_doctype_name_ratchet.py, which runs
          on a bench that has frappe/erpnext/hrms/payments.
          `files` is pinned to SCAN_ROOTS in the validator: a file scanned here but
          not covered by --update-baseline could fail with no way to record it.
        entry: python scripts/validation/doctype_name_validator.py
        language: system
        pass_filenames: true
        files: '^(verenigingen|scripts)/.*\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/validation/archived/)'

      - id: child-doctype-validate-guard
        name: 🧟 Dead Child-Validate Guard (hard gate)
        description: >-
          Blocks a NEW `def validate` on the controller of an `"istable": 1` DocType.
          Frappe never calls a child DocType's validate(): Document._validate() (and
          insert()/_save() more generally) iterate children calling only framework
          helpers (_validate_data_fields, _validate_selects, _validate_non_negative,
          ...), never d.run_method("validate"). #596 found 15 of these across this
          app; one (Member SEPA Mandate Link) was the documented mechanism behind
          another DocType's behaviour and never actually ran, which #584 had to work
          around. A hard gate, not a ratchet — #596 emptied the census to zero by
          moving each real rule into its parent's validate() (iterating the child
          table there) and deleting the rest, so there is nothing pre-existing to
          grandfather in. A deliberate exception (a controller invoked directly,
          never through parent.save()) is exempted with
          `def validate(self):  # child-validate-ok: <reason>`.
        entry: python scripts/validation/child_doctype_validate_guard.py
        language: system
        pass_filenames: true
        files: '/doctype/.*\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/validation/archived/)'

      - id: dynamic-link-append-validator
        name: 🔗 Dynamic Link Append Guard (hard gate)
        description: >-
          Blocks a literal `.append("<child_table>", {...})` dict that sets a
          Dynamic Link field's value without also setting that field's companion
          doctype field in the same literal. `update_child_table()` (and this
          app's `safe_child_table_update()` wrapper around it) persists a child
          row via `db_update()` directly -- no defaults, no `_validate_links()`,
          no controller hooks at all -- so the companion field is written as a
          silent NULL with no exception of any kind, and the parent becomes
          un-saveable on its next ordinary save(). #667:
          `sync_member_mandates()` did exactly this to `Member SEPA Mandate
          Link.sepa_mandate_doctype`. A hard gate, not a ratchet -- the census on
          this branch is zero after fixing #667's four sites, so there is
          nothing pre-existing to grandfather in.
        entry: python scripts/validation/dynamic_link_append_validator.py
        language: system
        pass_filenames: true
        files: '\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/validation/archived/)'

      - id: duplicate-helper-validator
        name: 👯 Duplicate Helper Guard (ratchet)
        description: >-
          Blocks a private helper — function or method — being copied into a SECOND
          file, or a copy being added to one already duplicated, when the copies are
          genuinely near-identical. A new copy of a name whose copies share little
          beyond the name is reported, not blocked. A copy-pasted helper is where a
          fix goes to die: on 2026-08-19 four defects landed or nearly landed because
          a fix was applied to one copy — with a comment explaining exactly why — while
          its siblings kept the bug (#392, #394, #399, plus two branches independently
          fixing the same test and colliding on merge). `_persist_eur_company` exists
          in EIGHT files; two were fixed to stop borrowing a company by currency and a
          third was missed. Ratcheted against
          scripts/validation/duplicate_helper_baseline.txt (71 known names, 119
          redundant copies) so existing code does not block commits; the baseline
          should only ever shrink. Restricted to leading-underscore names because
          Frappe REQUIRES `execute`/`get_context`/`run_tests` once per module, and
          counting those buries the real signal. Run with --report for the similarity
          view before consolidating: same name does not always mean same code.
          Runs at pre-push, not pre-commit — it scans the whole tree (~8s), and the
          answer cannot change from the file list of one commit.
        entry: python scripts/validation/duplicate_helper_validator.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: failed-write-validator
        name: 💾 Failed-Write Guard (ratchet) [advisory]
        description: >-
          Sibling of the Swallowed-Exception Guard, for the case it cannot see by
          design: a broad `except` around a DATABASE WRITE whose failure never
          reaches the caller — the row is silently lost and the operation reports
          success. PR #280 found NINE production defects of this exact shape at once,
          three of which had never worked in ANY deployment (no default payment
          mapping was ever created, no SEPA retry batch was ever saved, every
          Volunteer Skill row without a level was rejected). Several had thorough,
          PASSING tests, because the tests asserted the reported outcome and the
          reported outcome was "success". The four shapes reported are CLAIMS_SUCCESS
          (returns an explicit success flag), RETURNS_TRUTHY, LOOP_CONTINUES (the
          dropped row is the bug, not the loop) and FALLS_THROUGH — each one an
          exclusion the swallowed-exception rule makes on purpose. Fix by re-raising,
          or by returning/recording an explicit failure the caller reads; a genuinely
          best-effort write opts out with
          `# failed-write-ok: best-effort|caller-verifies|reported-elsewhere|false-positive`.
          Ratcheted against scripts/validation/failed_write_baseline.txt (162 known
          sites) so existing code does not block commits — the baseline should only
          ever shrink. ADVISORY while that inventory is triaged: it prints and exits
          0; add --strict to the entry below to make a new site fail the commit.
          The files/exclude below must stay a SUBSET of SCAN_ROOTS in the validator —
          anything scanned here but absent from the baseline fails on first edit.
        entry: python scripts/validation/failed_write_validator.py
        language: system
        pass_filenames: true
        files: '^(verenigingen|scripts)/.*\.py$'
        stages: [pre-commit]
        # verbose: pre-commit hides stdout for passing hooks, and this one passes
        # (advisory) even when it has findings — without this they are invisible.
        verbose: true
        exclude: '^(scripts/validation/archived/|scripts/validation/tests/|verenigingen/tests/)'

      - id: log-error-arg-order-validator
        name: 🔄 log_error(message, title) Argument Order (ratchet)
        description: >-
          frappe.log_error is (title, message) -- frappe/utils/error.py:44. Calling
          it the other way round positionally -- log_error(f"...{e}", "Some Title")
          -- truncates the real cause into a 140-char title and NEVER records the
          traceback: frappe's own swap-detection heuristic only fires when the
          (wrongly positioned) title argument contains a newline, which a
          single-line f-string never does. #602 measured roughly 1100 such sites
          tree-wide. Ratcheted against
          scripts/validation/log_error_arg_order_baseline.txt so existing code does
          not block commits -- the baseline should only ever shrink. Prefer explicit
          keyword arguments (log_error(title=..., message=...)) so a call can never
          be re-inverted. Mark a deliberate exception
          `# log-error-args-ok: false-positive`.
          The exclude below must stay a SUBSET of SCAN_ROOTS in the validator --
          anything scanned here but absent from the baseline fails on first edit.
        entry: python scripts/validation/log_error_arg_order_validator.py
        language: system
        pass_filenames: true
        files: '^(verenigingen|scripts)/.*\.py$'
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/validation/archived/|verenigingen/tests/)'

      - id: secure-operation-result-validator
        name: 🔐 Unchecked secure_document_operation Result
        description: >-
          `secure_document_operation` does NOT raise for an ordinary failed write — it
          catches the exception and returns `success=False`. A caller that ignores the
          return value is told nothing and carries on as if the row was written. Every
          instance found so far had exception handling wrapped around it that could
          never fire for THAT failure mode (a handler is still live for the three
          things outside its try: justification validation, the bypass_validations
          role gate, and a re-raised non-resumable DB error): a reversal Journal Entry that never
          reached the ledger was reported as a completed refund and then claimed the
          idempotency key forever (#379), the same shape on the forward path makes a
          donation impossible to reverse (#381), and an access REVOCATION left the
          user holding the role profile while reporting it removed. A result that is
          returned is fine, since the caller gets it and the responsibility with it.
          Genuinely best-effort writes should still read `.success` and log, then mark
          the call `# secure-op-ok: best-effort|caller-verifies|false-positive`.
          Flags DISCARDED, UNCHECKED, TRUTHINESS (`if secure_document_operation(...)`
          is ALWAYS true — the result class defines no `__bool__`) and BAD_OPT_OUT (an
          unrecognised or missing pragma reason, since on a rule with no baseline an
          unpoliced pragma is the only way it can quietly die).
          NO BASELINE, deliberately: the full sweep of all 206 non-test call sites
          found exactly three violations and all three are fixed, so this starts at
          zero and any hit is a real regression rather than inherited debt.
        entry: python scripts/validation/secure_operation_result_validator.py
        language: system
        pass_filenames: true
        files: '^verenigingen/.*\.py$'
        stages: [pre-commit]
        exclude: '^verenigingen/tests/'

      - id: deprecated-function-checker
        name: 🚨 Deprecated Function Usage Check
        description: Check for usage of deprecated functions using Codanna
        entry: python scripts/validation/archived/codanna_deprecated_checker.py --directory verenigingen
        language: system
        pass_filenames: false
        stages: [pre-commit]
        exclude: '^(archived_unused/|archived_deleted/|archived_removal/|scripts/testing/|scripts/debug/)'

      - id: workspace-validator
        name: Workspace integrity validation
