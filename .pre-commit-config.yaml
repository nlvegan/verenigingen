# Pre-commit hooks for Verenigingen app
# Install with: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'
      - id: end-of-file-fixer
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'
      - id: check-docstring-first
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=110']
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: [
          '--max-line-length=120',
          '--max-complexity=20',
          '--extend-ignore=E501,W503,E203,F401,E722,F821,C901,E225'
        ]
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|.*test.*\.py|.*debug.*\.py|archived_.*)'

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length', '110']
        exclude: '^(scripts/|tests/|debug_utils/|dev_scripts/|integration_tests/|verenigingen/tests/|frontend_tests/|archived_unused/|archived_deleted/)'

  - repo: https://github.com/PyCQA/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        args: [
          '--rcfile=.pylintrc',
          '--fail-under=7.0',
          '--jobs=0',
          '--ignore-paths=archived_unused/.*,archived_deleted/.*,archived_removal/.*,archived_docs/.*'
        ]
        exclude: '^(node_modules|.git|dist|build|scripts|tests|debug_utils|dev_scripts|integration_tests|verenigingen/tests|frontend_tests|archived_unused|archived_deleted|archived_removal|archived_docs)/'

  # Security Validation (Optimized)
  - repo: local
    hooks:
      - id: bandit-focused
        name: 🔍 Security Linting (Bandit Focused - 3s runtime)
        description: Fast security scan focused on critical files
        entry: ./scripts/security/bandit-focused.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      # INAPPROPRIATE MOCK PREVENTION (PHASE 4 WEEK 3 ADDITION)
      - id: block-inappropriate-mocks
        name: 🚫 Block Inappropriate Mocks (Phase 4 Week 3)
        description: Prevent inappropriate business logic mocks based on systematic elimination strategy
        entry: python scripts/validation/archived/block_inappropriate_mocks.py
        language: system
        files: '^.*test.*\.py$|^.*/tests/.*\.py$'
        pass_filenames: true
        stages: [pre-commit, pre-push]
        verbose: true
        fail_fast: true

      # TEST QUALITY ENFORCEMENT (CRITICAL - MUST BE FIRST)
      - id: test-quality-enforcer
        name: 🚨 Test Quality Enforcer (CRITICAL)
        description: Block mock abuse and enforce real integration testing patterns
        entry: python scripts/validation/test_quality_enforcer.py
        language: system
        files: '^.*test.*\.py$|^.*/tests/.*\.py$'
        exclude: '^(.*debug.*|.*_debug\.py|.*utils/debug/.*\.py|scripts/.*|archived_.*)'
        pass_filenames: true
        stages: [pre-commit, pre-push]
        verbose: true
        fail_fast: true

      # Security validation hooks (TEMPORARILY DISABLED)
