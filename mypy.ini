[mypy]
# Python version
python_version = 3.10

# Stub paths
mypy_path = frappe-stubs

# General settings
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
show_column_numbers = True

# Start permissive - gradually increase strictness
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True

# Allow dynamic typing where needed
allow_redefinition = True
implicit_reexport = True

# Frappe framework doesn't have type stubs
[mypy-frappe.*]
ignore_missing_imports = True

[mypy-erpnext.*]
ignore_missing_imports = True

# Third-party libraries without stubs
[mypy-qrcode.*]
ignore_missing_imports = True

[mypy-iban.*]
ignore_missing_imports = True

# Service layer - enforce stricter typing (already has type hints)
[mypy-verenigingen.services.*]
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True

# Controllers - gradual typing (being added now)
[mypy-verenigingen.verenigingen.doctype.member.member]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-verenigingen.verenigingen.doctype.volunteer.volunteer]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-verenigingen.verenigingen.doctype.chapter.chapter]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-verenigingen.verenigingen.doctype.membership.membership]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-verenigingen.verenigingen.doctype.membership_dues_schedule.membership_dues_schedule]
disallow_untyped_defs = False
check_untyped_defs = True
