[project]
name = "verenigingen"
authors = [
    { name = "Foppe de Haan", email = "foppe@veganisme.org"}
]
description = "Comprehensive association management system for Dutch non-profit organizations with ERPNext integration, eBoekhouden accounting sync, SEPA direct debit, volunteer management, ANBI compliance features, and Mollie backend API integration."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
keywords = ["frappe", "erpnext", "association", "membership", "volunteer", "eboekhouden", "sepa", "dutch", "non-profit", "anbi", "mollie", "payments", "reconciliation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Mollie Backend API dependencies
    "mollie-api-python>=3.6.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    # Machine learning + dataframes for predictive analytics / CSV imports
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    # Bank statement parsing
    "mt-940>=4.0",
    # XML security (XXE prevention)
    "defusedxml>=0.7.1",
    # MijnRood sync: SSH tunnel + MySQL client for remote DB polling.
    # Pin to <4: paramiko 4.x dropped ssh-rsa AND ssh-dss from its
    # _key_info registry, so the MijnRood server (OpenSSH 5.3 on
    # DirectAdmin shared hosting, only offers ssh-rsa host keys) cannot
    # be reached. Lifting this pin requires either a server upgrade on
    # MijnRood's side or switching SSH libraries.
    "paramiko>=2.7.2,<4",
    "pymysql>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "faker>=18.0.0",
    "requests-mock>=1.11.0",
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "hypothesis>=6.0.0",
    "freezegun>=1.2.0",
]
test = [
    "faker>=18.0.0",
    "requests-mock>=1.11.0",
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "hypothesis>=6.0.0",
    "freezegun>=1.2.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe app dependencies (replaces required_apps in hooks.py)
[tool.bench.frappe-dependencies]
erpnext = ">=15.0.0"
payments = ">=0.0.1"
hrms = ">=15.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.black]
line-length = 110
target-version = ['py310', 'py311']
include = '\.pyi?$'
# `exclude` governs directory TRAVERSAL only -- black happily reformats a file from
# one of these paths when it is named explicitly on the command line, which is how a
# 21-line addition under `verenigingen/tests/` became 107 changed lines. `force-exclude`
# is what applies to named files, and these paths are hand-formatted on purpose.
force-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | migrations
  | patches
  | scripts
  | tests
  | debug_utils
  | dev_scripts
  | integration_tests
  | frontend_tests
)/
'''
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | migrations
  | patches
  | scripts
  | tests
  | debug_utils
  | dev_scripts
  | integration_tests
  | frontend_tests
)/
'''

[tool.isort]
profile = "black"
line_length = 110
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/node_modules/*", "*/build/*", "*/dist/*", "*/scripts/*", "*/tests/*", "*/debug_utils/*", "*/dev_scripts/*", "*/integration_tests/*", "*/frontend_tests/*"]

[tool.flake8]
# DEPRECATED: flake8 replaced by ruff - kept for reference
max-line-length = 120
extend-ignore = ["E203", "W503", "E501", "F401", "E722", "F821", "C901", "E225"]
exclude = [
    "migrations",
    "node_modules",
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "scripts",
    "tests",
    "debug_utils",
    "dev_scripts",
    "integration_tests",
    "frontend_tests"
]

[tool.ruff]
# Ruff replaces flake8 + isort (10-100x faster)
line-length = 110
target-version = "py310"

exclude = [
    "migrations",
    "node_modules",
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "scripts",
    "tests",
    "debug_utils",
    "dev_scripts",
    "integration_tests",
    "frontend_tests",
    "archived_*",
]

[tool.ruff.lint]
# Enable rules: E/W (pycodestyle), F (pyflakes), I (isort)
# Start conservative, enable more rules over time
select = ["E", "W", "F", "I"]

# Ignore rules matching previous flake8 config
ignore = [
    "E203",  # Whitespace before ':' (conflicts with black)
    "E501",  # Line too long (handled by formatter)
    "E712",  # Comparison to True/False (sometimes intentional)
    "E713",  # Test for membership should be 'not in'
    "E721",  # Type comparison (sometimes needed)
    "E722",  # Do not use bare 'except'
    "E731",  # Do not assign a lambda expression
    "F401",  # Unused import (too noisy during development)
    "F403",  # Star imports
    "F405",  # May be undefined from star import
    "F811",  # Redefinition of unused name
    "F821",  # Undefined name (frappe._ and other framework magic)
    "F823",  # Local variable referenced before assignment
    "F841",  # Local variable never used
    "F541",  # f-string without placeholders (intentional for consistency)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Match isort profile for black compatibility
known-first-party = ["verenigingen"]
force-single-line = false
combine-as-imports = true
