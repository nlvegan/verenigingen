name: 'Setup Verenigingen Environment'
description: 'Sets up the environment for Verenigingen testing on GitHub hosted runners'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.14'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  frappe-user:
    description: 'GitHub user/org for Frappe repository'
    required: false
    default: 'frappe'
  frappe-branch:
    description: 'Frappe branch to use'
    required: false
    default: 'version-16'
  erpnext-user:
    description: 'GitHub user/org for ERPNext repository'
    required: false
    default: 'frappe'
  erpnext-branch:
    description: 'ERPNext branch to use'
    required: false
    default: 'version-16'
  build-assets:
    description: 'Whether to build frontend assets'
    required: false
    default: 'true'
  enable-coverage:
    description: 'Enable coverage collection'
    required: false
    default: 'false'
  mode:
    description: >-
      full: build the whole bench here (checkouts, pip/JS installs, assets, site + apps).
      restore: unpack the snapshot a `full` job with `snapshot: true` uploaded, import its
      database and start bench - the shards' path (#2184: setup was ~7 min x 12 shards).
    required: false
    default: 'full'
  snapshot:
    description: "full mode only: 'true' packages the built bench + DB dump as an artifact"
    required: false
    default: 'false'
  snapshot-name:
    description: 'Artifact name the snapshot is uploaded under / downloaded from'
    required: false
    default: 'bench-snapshot'

outputs:
  python-version:
    description: >-
      The exact Python the bench was built with. A restore must use the same one: the venv's
      interpreter symlink points into the runner's tool cache by full version.
    value: ${{ steps.setup-python.outputs.python-version }}

runs:
  using: "composite"
  steps:
    - name: Add test_site to hosts
      shell: bash
      run: |
        echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
        git config --global init.defaultBranch main
        git config --global advice.detachedHead false

    - name: Checkout Verenigingen
      if: ${{ inputs.mode == 'full' }}
      uses: actions/checkout@v4
      with:
        path: apps/${{ github.event.repository.name }}

    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate Python Files
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      run: |
        python -m compileall -q -f "${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}"
        if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}"; then
          echo "Found merge conflicts"
          exit 1
        fi

    - name: Checkout Frappe
      if: ${{ inputs.mode == 'full' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.frappe-user }}/frappe
        ref: ${{ inputs.frappe-branch }}
        path: apps/frappe

    # Balance parallel shards by MEASURED runtime instead of test count. Frappe's
    # ParallelTestRunner weighs each file by its number of `def test_` methods, so a
    # file with 3 slow integration tests weighs 3 while a file with 40 trivial unit
    # tests weighs 40 - and whichever shard lands the slow modules sets the whole
    # job's wall clock. The patch teaches the runner to read the committed
    # verenigingen/tests/test_timings.json instead.
    #
    # This step FAILS THE JOB when the patch stops applying, deliberately. Frappe
    # does change parallel_test_runner.py, and the ungated failure mode is silent:
    # sharding reverts to the count heuristic, every shard still passes, and the
    # imbalance only surfaces as a shard tipping over the 60-minute timeout weeks
    # later. Regenerate the patch against the current frappe; do not skip the step.
    - name: Apply parallel-shard weighting patch to Frappe
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      run: |
        PATCH="${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}/scripts/frappe-parallel-test-weights.patch"
        if [ ! -f "$PATCH" ]; then
          echo "::error::Missing $PATCH - parallel shard weighting cannot be applied."
          exit 1
        fi
        if ! git -C "${GITHUB_WORKSPACE}/apps/frappe" apply --check "$PATCH"; then
          echo "::error::frappe-parallel-test-weights.patch no longer applies to ${{ inputs.frappe-user }}/frappe@${{ inputs.frappe-branch }} - frappe changed parallel_test_runner.py. Regenerate the patch. Skipping this step would silently fall back to count-based sharding."
          exit 1
        fi
        git -C "${GITHUB_WORKSPACE}/apps/frappe" apply "$PATCH"
        echo "Applied measured-runtime shard weighting to frappe."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: true

    - name: Cache pip
      if: ${{ inputs.mode == 'full' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-

    - name: Cache yarn
      if: ${{ inputs.mode == 'full' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    # This app is npm-managed (no yarn.lock), so its downloads never hit the yarn cache.
    - name: Cache npm
      if: ${{ inputs.mode == 'full' }}
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    # wkhtmltopdf is taken from the upstream release asset rather than Ubuntu's
    # package because only the upstream build carries the patched Qt needed for
    # headless rendering. That asset is 17 MB, and every one of the 12 test
    # shards fetched it again on every push. GitHub's release-asset host answers
    # a share of that fan-out with a 5xx or a dropped connection, and `wget`
    # does not retry HTTP error responses by default - so a single 5xx failed
    # `Install System Dependencies`, which skipped every later step including
    # `Initialize Bench Environment` and the tests themselves. The shard then
    # reported failure having run no tests. Six occurrences in one day (#319).
    #
    # Caching the asset takes a warm run off the network entirely. The checksum
    # is pinned because an unverified body is worse here than a failed download:
    # a truncated file or an HTML error page would otherwise be installed, or
    # saved into the cache and inherited by every later run.
    - name: Cache wkhtmltopdf package
      uses: actions/cache@v4
      with:
        path: /tmp/wkhtmltox.deb
        key: wkhtmltox-0.12.6.1-2-jammy-amd64

    # The apt mirror is not down when a shard fails here, it is SLOW. Measured
    # over 37 shards that failed `apt-get install` on 2026-11-06: the mirror was
    # reachable and serving at ~25-45 kB/s, so the 13.6 MB install was still
    # downloading when the 300 s backstop below killed it (7.6-13.3 MB fetched).
    # Healthy shards of the same runs fetched the same 13.6 MB in 1-2 s. The
    # wkhtmltopdf install pulls a further ~10 MB of fonts from the same mirror
    # under its own 300 s budget, so trimming the package list alone would only
    # move the failure one command later.
    #
    # So the .debs are cached and a warm shard fetches nothing from the mirror.
    # Keyed per runner image and ISO week: within a week every shard restores
    # the same set; a new week starts from the previous week's set (restore-keys)
    # and only downloads what changed. Safe to reuse: apt checks every cached
    # .deb against the hashes in the signed index it has just fetched, and
    # re-downloads any that do not match, so a stale or bad file is never
    # installed. Only `*.deb` is cached - apt's `partial/` subdirectory belongs to
    # its sandbox user and would make the save step fail on an unreadable path.
    - name: Compute apt archive cache key
      id: apt-cache-key
      shell: bash
      run: |
        echo "prefix=apt-archives-${ImageOS:-unknown}-" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - name: Cache apt archives
      uses: actions/cache@v4
      with:
        path: ~/.cache/apt-archives/*.deb
        key: ${{ steps.apt-cache-key.outputs.prefix }}${{ steps.apt-cache-key.outputs.week }}
        restore-keys: |
          ${{ steps.apt-cache-key.outputs.prefix }}

    - name: Install System Dependencies
      shell: bash
      run: |
        # The wkhtmltopdf fetch below was hardened in #319 after six shards died
        # in one day on an unretried 5xx. The apt fetches in this same step never
        # got the same treatment, and on 2026-08-19 seven of twelve shards hung
        # here: the Azure apt mirror answered `Ign:` for every line, apt fell back
        # to archive.ubuntu.com, and stalled on `noble-security InRelease` until
        # the job's 60-minute cap killed it. `Run Tests` was skipped, so each
        # shard reported failure having run no tests - the same symptom and the
        # same log-dive as #319. The green shards fetched the Azure mirror in 1s.
        #
        # Retries alone would NOT have caught this. #319 was exit 8, a server
        # error response, which retrying does fix; this was an indefinite hang,
        # which only a timeout fixes. Both are set, and they apply to every apt
        # invocation in this step rather than just the one that was observed
        # failing - `apt-get install` can stall on exactly the same mirror.
        sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'APTCONF'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        APTCONF

        # Every apt invocation below downloads into, and reuses, the cached
        # archive directory (see the "Cache apt archives" step).
        APT_ARCHIVES="$HOME/.cache/apt-archives"
        mkdir -p "$APT_ARCHIVES/partial"
        echo "cached .debs restored: $(find "$APT_ARCHIVES" -maxdepth 1 -name '*.deb' | wc -l)"
        echo "Dir::Cache::Archives \"$APT_ARCHIVES/\";" | sudo tee /etc/apt/apt.conf.d/99-ci-archive-cache >/dev/null

        # Wall-clock backstop, after erpnext's run_ci_step()
        # (.github/helper/install.sh). Composite-action steps cannot take
        # `timeout-minutes`, so the bound has to be applied per-command here.
        # Without it the only limit is the job's 60 minutes, which is what turned
        # one unreachable mirror into ~7 runner-hours across the matrix for zero
        # test signal.
        #
        # `sudo timeout`, not `timeout sudo`: the child runs as root, so timeout
        # must be root too or it cannot signal what it is supposed to kill.
        # `--foreground` so the signal reaches the command rather than only the
        # timeout wrapper. `date -u` on both sides makes a stall's duration
        # readable in the log without arithmetic - the diagnosis cost is what
        # made this expensive twice.
        apt_get() {
          date -u
          sudo timeout --foreground "${CI_APT_STEP_TIMEOUT:-300}" apt-get "$@"
          local rc=$?
          date -u
          return $rc
        }

        if ! apt_get update; then
          echo "::error::apt-get update failed or timed out. The Ubuntu mirror is unreachable from this runner. This is an infrastructure failure, not a code failure - no test has run at this point. Re-run the job."
          exit 1
        fi

        apt_get remove -y mysql-server mysql-client || true

        # mariadb-client: this action calls `mariadb` to prepare the database.
        # libmariadb-dev: frappe pins mysqlclient, which builds against it.
        # redis-server: never RUN here (Redis is the job's service containers),
        # but `bench.config.redis.generate_config()` in Initialize Bench
        # Environment shells out to `redis-server --version` with no fallback,
        # so the binary must exist. It is not on the runner image.
        # Not installed, although frappe's CI template does: libcups2-dev (only
        # pycups needs it, and no app in the bench depends on pycups). It pulled
        # 25 of the 37 packages, 7.1 of the 13.3 MB.
        if ! apt_get install -y \
          redis-server \
          mariadb-client \
          libmariadb-dev; then
          echo "::error::apt-get install failed or timed out. The Ubuntu mirror is unreachable or too slow from this runner. This is an infrastructure failure, not a code failure - no test has run at this point. Re-run the job."
          exit 1
        fi

        # Install wkhtmltopdf (see the cache step above for why this is guarded).
        WKHTMLTOX_DEB=/tmp/wkhtmltox.deb
        WKHTMLTOX_SHA256=ee88d74834bdec650f7432c7d3ef1c981e42ae7a762a75a01f7f5da59abc18d5
        WKHTMLTOX_URL=https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb

        verify_wkhtmltox() {
          echo "${WKHTMLTOX_SHA256}  ${WKHTMLTOX_DEB}" | sha256sum --check --status 2>/dev/null
        }

        if verify_wkhtmltox; then
          echo "wkhtmltopdf restored from cache and matches its pinned checksum."
        else
          rm -f "$WKHTMLTOX_DEB"
          # -nv, not -q: the old -q suppressed the reason for the failure, which
          # is why six occurrences of this took four log-dives to attribute.
          # --retry-on-http-error is the one that matters - the observed failure
          # was exit 8 (server error response), which wget does not retry for.
          wget -nv \
            --tries=5 \
            --waitretry=15 \
            --retry-connrefused \
            --retry-on-http-error=429,500,502,503,504 \
            -O "$WKHTMLTOX_DEB" "$WKHTMLTOX_URL" || true
        fi

        if ! verify_wkhtmltox; then
          echo "::error::wkhtmltopdf could not be fetched from ${WKHTMLTOX_URL} after 5 attempts, or the body did not match its pinned checksum. This is an infrastructure failure, not a code failure - no test has run at this point. Re-run the job."
          exit 1
        fi

        # Its font dependencies (~10 MB) come from the same mirror, so this
        # install fails the same way as the one above and says so the same way.
        if ! apt_get install -y "$WKHTMLTOX_DEB"; then
          echo "::error::apt-get install of wkhtmltopdf's dependencies failed or timed out. The Ubuntu mirror is unreachable or too slow from this runner. This is an infrastructure failure, not a code failure - no test has run at this point. Re-run the job."
          exit 1
        fi

        # Drop superseded versions so the weekly cache does not keep growing.
        # Local only: autoclean reads the index fetched above, no download.
        apt_get autoclean -y || true
        echo "cached .debs to save: $(find "$APT_ARCHIVES" -maxdepth 1 -name '*.deb' | wc -l)"

    - name: Initialize Bench Environment
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/{sites,config,logs,config/pids,sites/test_site}
        python -m venv ${GITHUB_WORKSPACE}/env
        source ${GITHUB_WORKSPACE}/env/bin/activate
        pip install --quiet --upgrade pip
        pip install --quiet frappe-bench

        # Generate bench configuration
        python <<EOF
        from bench.config.common_site_config import setup_config
        from bench.config.redis import generate_config
        from bench.config.procfile import setup_procfile

        bench_path = "${GITHUB_WORKSPACE}"
        setup_config(bench_path)
        generate_config(bench_path)
        # Redis is provided by the job's service containers (ports 11000/13000),
        # so bench start must NOT also try to bind those ports — a losing fight
        # that crashes honcho and takes its redis down mid-setup.
        setup_procfile(
            bench_path,
            skip_redis=True,
            skip_web=False,
            skip_watch=True,
            skip_socketio=True,
            skip_schedule=True,
            with_coverage=${{ inputs.enable-coverage == 'true' && 'True' || 'False' }},
        )
        EOF

        # Drop the RQ workers. bench's Procfile template guards every other
        # process behind a skip_* flag but emits `worker:` UNCONDITIONALLY, and
        # setup_procfile() has no skip_worker parameter -- so this is the only
        # way to keep `bench start` from running workers against the test site.
        #
        # Why that matters: frappe.enqueue does NOT run inline under tests.
        # `call_directly = now or (not is_async and not frappe.in_test)`
        # (frappe/utils/background_jobs.py), so with the default is_async=True a
        # test's job goes to the REAL redis queue and a worker executes it in a
        # SEPARATE process with its OWN database connection -- concurrently with
        # the suite, against the same database.
        #
        # That worker then inserts naming-series documents and takes the
        # `tabSeries` row lock while a test's still-open transaction wants the
        # same row. Every Bulk Operation Tracker insert in the shard blocked for
        # the full innodb_lock_wait_timeout (~51s apart in the logs) and failed
        # with (1205, 'Lock wait timeout exceeded') -- 10 of the failures that
        # blocked this PR. It was previously mis-filed as local test-site
        # pollution because CI was believed to be worker-free. It is not.
        #
        # Tests that genuinely need a job to run should execute it inline
        # (now=True) rather than depend on a worker racing the suite.
        if grep -qE '^worker' "${GITHUB_WORKSPACE}/Procfile"; then
          sed -i '/^worker/d' "${GITHUB_WORKSPACE}/Procfile"
          echo "Removed RQ worker lines from Procfile:"
        else
          echo "::error::No worker lines found in the generated Procfile."
          echo "::error::bench's template emits them unconditionally, so this means"
          echo "::error::the Procfile format changed -- verify before removing this guard."
          exit 1
        fi
        cat "${GITHUB_WORKSPACE}/Procfile"

        # Copy site configuration
        cp "${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}/.github/helper/db/mariadb.json" \
           "${GITHUB_WORKSPACE}/sites/test_site/site_config.json"

    - name: Configure MariaDB
      shell: bash
      run: |
        mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root -e "SET GLOBAL character_set_server = 'utf8mb4'"
        mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
        mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root -e "CREATE DATABASE IF NOT EXISTS test_frappe"
        mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root -e "CREATE USER IF NOT EXISTS 'test_frappe'@'localhost' IDENTIFIED BY 'test_frappe'"
        mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root -e "GRANT ALL PRIVILEGES ON \`test_frappe\`.* TO 'test_frappe'@'localhost'"
        mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root -e "FLUSH PRIVILEGES"

    - name: Checkout ERPNext
      if: ${{ inputs.mode == 'full' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.erpnext-user }}/erpnext
        ref: ${{ inputs.erpnext-branch }}
        path: apps/erpnext

    - name: Checkout Payments
      if: ${{ inputs.mode == 'full' }}
      uses: actions/checkout@v4
      with:
        repository: frappe/payments
        ref: version-16
        path: apps/payments

    - name: Checkout HRMS
      if: ${{ inputs.mode == 'full' }}
      # verenigingen declares `hrms = ">=15.0.0"` and uses Expense Claim in core
      # (permissions, termination, account creation, volunteer expenses); without
      # it tabExpense Claim is absent and those suites error in CI.
      uses: actions/checkout@v4
      with:
        repository: frappe/hrms
        ref: version-16
        path: apps/hrms

    - name: Install Python Dependencies
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      run: |
        source ${GITHUB_WORKSPACE}/env/bin/activate

        for app in ${GITHUB_WORKSPACE}/apps/*/; do
          app_name="$(basename $app)"
          if [ -f "${app}setup.py" ] || [ -f "${app}pyproject.toml" ]; then
            echo "Installing Python dependencies for ${app_name}"
            pip install --upgrade -e "${app}[dev,test]" || pip install --upgrade -e "${app}"
          fi
          echo "$app_name" >> sites/apps.txt
        done

        # run-parallel-tests --with-coverage wraps the run in frappe's
        # CodeCoverage, which imports the `coverage` package at runtime; it is
        # not a frappe/app dependency, so install it when coverage is enabled.
        if [ "${{ inputs.enable-coverage }}" = "true" ]; then
          pip install --quiet coverage
        fi

    - name: Install JS Dependencies
      if: ${{ inputs.mode == 'full' && inputs.build-assets == 'true' }}
      shell: bash
      run: |
        source ${GITHUB_WORKSPACE}/env/bin/activate
        for app in ${GITHUB_WORKSPACE}/apps/*/; do
          if [ -f "${app}package.json" ]; then
            echo "Installing JS dependencies for $(basename $app)"
            pushd "$app"
            # Pick the package manager per app, not globally: frappe/erpnext/
            # hrms/builder ship a committed yarn.lock and are yarn-managed;
            # this app dropped its yarn.lock in 1ed8cd0d and is npm-managed.
            # Runners have REAL yarn 1.22.22 (unlike the broken cmdtest stub
            # on dev boxes), and yarn reads `resolutions` while npm reads
            # `overrides` -- an unconditional `yarn --check-files` here ran
            # real yarn for this app too and pinned from the wrong block
            # (#272).
            if [ -f "yarn.lock" ]; then
              yarn --check-files || npm install
            else
              npm install
            fi
            popd
          fi
        done

    # restore mode (#2184): the shard gets the bench a `full` job built - venv, apps (without
    # node_modules), built assets, site config - and that job's database, instead of
    # rebuilding them (~7 min of every shard). System packages above are still installed
    # here (cached), since the tarball carries only the workspace.
    - name: Download bench snapshot
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.snapshot-name }}
        path: ${{ runner.temp }}/bench-snapshot

    - name: Restore bench snapshot
      if: ${{ inputs.mode == 'restore' }}
      shell: bash
      run: |
        set -euo pipefail
        SNAP="${RUNNER_TEMP}/bench-snapshot"
        date -u
        tar --zstd -xf "$SNAP/bench.tar.zst" -C "${GITHUB_WORKSPACE}"
        date -u
        CFG="${GITHUB_WORKSPACE}/sites/test_site/site_config.json"
        DB_NAME=$(python3 -c "import json,sys; c=json.load(open(sys.argv[1])); print(c['db_name'])" "$CFG")
        DB_USER=$(python3 -c "import json,sys; c=json.load(open(sys.argv[1])); print(c.get('db_user') or c['db_name'])" "$CFG")
        DB_PASS=$(python3 -c "import json,sys; c=json.load(open(sys.argv[1])); print(c['db_password'])" "$CFG")
        zstd -dc "$SNAP/db.sql.zst" | mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root
        # A dump carries no MariaDB users. frappe created the site user scoped to whatever host
        # the server saw (the Docker gateway here), so recreate it for any host.
        mariadb --host 127.0.0.1 --port 3306 -u root -pdb_root -e \
          "CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASS}'; GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'%'; FLUSH PRIVILEGES;"
        date -u
        echo "Restored bench and database ${DB_NAME} from snapshot."

    - name: Start Bench
      shell: bash
      run: |
        source ${GITHUB_WORKSPACE}/env/bin/activate
        bench start &> ${GITHUB_WORKSPACE}/bench_start.log &

        # Gate on bench-managed redis being ready before later steps
        # (reinstall / install-app) enqueue jobs against redis_queue. Frappe
        # upstream skips this because a build step buys redis time; here
        # install-app runs immediately and was racing redis_queue (port 11000),
        # surfacing as "Error 111 connecting to 127.0.0.1:11000".
        # redis_queue=11000, redis_cache=13000 (frappe-bench defaults).
        for port in 11000 13000; do
          ready=""
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
              ready="yes"
              echo "redis ready on $port after ${i}s"; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::bench-managed redis never came up on port $port within 60s"
            echo "===================== bench_start.log ====================="
            cat ${GITHUB_WORKSPACE}/bench_start.log || echo "(no bench_start.log)"
            echo "==========================================================="
            exit 1
          fi
        done

    - name: Build Assets and Setup Site
      if: ${{ inputs.mode == 'full' && inputs.build-assets == 'true' }}
      shell: bash
      run: |
        source ${GITHUB_WORKSPACE}/env/bin/activate
        CI=Yes bench build --force --production &
        build_pid=$!
        bench --site test_site reinstall --yes
        wait $build_pid

    - name: Setup Site (No Assets)
      if: ${{ inputs.mode == 'full' && inputs.build-assets != 'true' }}
      shell: bash
      run: |
        source ${GITHUB_WORKSPACE}/env/bin/activate
        bench --site test_site reinstall --yes

    - name: Install Apps on Site
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      run: |
        source ${GITHUB_WORKSPACE}/env/bin/activate
        bench --site test_site install-app erpnext
        bench --site test_site install-app hrms
        bench --site test_site install-app payments
        bench --site test_site install-app ${{ github.event.repository.name }}

    # full mode with snapshot (#2184): package what restore mode needs. node_modules is
    # excluded - the assets are already built and server tests do not run JS.
    - name: Package bench snapshot
      if: ${{ inputs.mode == 'full' && inputs.snapshot == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        SNAP="${RUNNER_TEMP}/bench-snapshot"
        mkdir -p "$SNAP"
        DB_NAME=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['db_name'])" "${GITHUB_WORKSPACE}/sites/test_site/site_config.json")
        mariadb-dump --host 127.0.0.1 --port 3306 -u root -pdb_root \
          --single-transaction --quick --routines --triggers --events --databases "$DB_NAME" \
          | zstd -T0 -q -o "$SNAP/db.sql.zst"
        cd "${GITHUB_WORKSPACE}"
        # bench is still running, so a log can change mid-read: tar then exits 1 ("file changed as
        # we read it"). Site logs are excluded and exit 1 alone is tolerated; 2 is a real failure.
        tar --zstd -cf "$SNAP/bench.tar.zst" --exclude='apps/*/node_modules' --exclude='sites/*/logs' \
          --warning=no-file-changed apps env sites config Procfile || [ $? -eq 1 ]
        ls -la "$SNAP"

    - name: Upload bench snapshot
      if: ${{ inputs.mode == 'full' && inputs.snapshot == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.snapshot-name }}
        path: ${{ runner.temp }}/bench-snapshot
        compression-level: 0  # already zstd
        retention-days: 1
        if-no-files-found: error
