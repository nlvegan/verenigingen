name: Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      # Only run tests if Python code changed
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Test category to run (all, critical, services, integration, security)'
        required: false
        default: 'all'

# Cancel previous runs on same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_SITE: dev.veganisme.net
  PYTHON_VERSION: '3.12'

jobs:
  # Quick check to determine if we should run tests
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.python }}
      test_files: ${{ steps.filter.outputs.python_files }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'verenigingen/**/*.py'
            docs:
              - '**/*.md'
              - 'docs/**'
            config:
              - '*.json'
              - '*.yml'
              - '*.yaml'

      - name: Log change detection
        run: |
          echo "Python changes: ${{ steps.filter.outputs.python }}"
          echo "Docs only: ${{ steps.filter.outputs.docs }}"

  # Critical tests - always run first, fail fast
  critical:
    name: Critical Tests
    needs: changes
    if: needs.changes.outputs.should_test == 'true'
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run Contract Tests
        run: |
          cd /home/frappe/frappe-bench
          bench --site ${{ env.FRAPPE_SITE }} run-tests \
            --module verenigingen.tests.contracts \
            --failfast
        continue-on-error: false

      - name: Run Core Service Tests
        run: |
          cd /home/frappe/frappe-bench
          bench --site ${{ env.FRAPPE_SITE }} run-tests \
            --module verenigingen.tests.services.test_operation_result \
            --module verenigingen.tests.services.test_operation_result_migration \
            --failfast

  # Parallel test matrix
  test-matrix:
    name: Tests (${{ matrix.category }})
    needs: [changes, critical]
    if: needs.changes.outputs.should_test == 'true'
    runs-on: self-hosted
    timeout-minutes: 30

    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        category:
          - services
          - integration
          - security
          - backend-unit
          - backend-components

    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ matrix.category }} tests
        run: |
          cd /home/frappe/frappe-bench

          case "${{ matrix.category }}" in
            services)
              bench --site ${{ env.FRAPPE_SITE }} run-tests \
                --module verenigingen.tests.services
              ;;
            integration)
              bench --site ${{ env.FRAPPE_SITE }} run-tests \
                --module verenigingen.tests.integration
              ;;
            security)
              bench --site ${{ env.FRAPPE_SITE }} run-tests \
                --module verenigingen.tests.security
              ;;
            backend-unit)
              bench --site ${{ env.FRAPPE_SITE }} run-tests \
                --module verenigingen.tests.backend.unit
              ;;
            backend-components)
              bench --site ${{ env.FRAPPE_SITE }} run-tests \
                --module verenigingen.tests.backend.components
              ;;
          esac

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.category }}
          path: /home/frappe/frappe-bench/sites/${{ env.FRAPPE_SITE }}/test-results/
          retention-days: 7

  # Mollie integration tests (separate due to external dependencies)
  mollie:
    name: Mollie Integration
    needs: [changes, critical]
    if: needs.changes.outputs.should_test == 'true'
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Run Mollie Core Tests
        run: |
          cd /home/frappe/frappe-bench
          bench --site ${{ env.FRAPPE_SITE }} run-tests \
            --module verenigingen.verenigingen_payments.mollie.tests.test_core_integration
        continue-on-error: true  # Don't fail CI if Mollie API is unavailable

      - name: Run Mollie Contract Tests
        run: |
          cd /home/frappe/frappe-bench
          # Run only the contract validation tests (no external API calls)
          # Use bench to ensure Frappe environment is properly loaded
          bench --site ${{ env.FRAPPE_SITE }} run-tests \
            --module verenigingen.verenigingen_payments.mollie.tests.test_core_integration \
            --test TestMollieClientContractValidation

  # Coverage report (runs after all tests)
  coverage:
    name: Coverage Report
    needs: [test-matrix, mollie]
    if: always() && needs.changes.outputs.should_test == 'true'
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run tests with coverage
        run: |
          cd /home/frappe/frappe-bench
          bench --site ${{ env.FRAPPE_SITE }} run-tests \
            --app verenigingen \
            --coverage \
            --coverage-report=xml
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: /home/frappe/frappe-bench/sites/${{ env.FRAPPE_SITE }}/coverage.xml
          fail_ci_if_error: false
          verbose: true

  # Summary job
  test-summary:
    name: Test Summary
    needs: [critical, test-matrix, mollie]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.critical.result }}" == "success" ]; then
            echo "✅ Critical tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Critical tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-matrix.result }}" == "success" ]; then
            echo "✅ Test matrix passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some test categories failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.mollie.result }}" == "success" ]; then
            echo "✅ Mollie tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Mollie tests failed (may be API unavailable)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if critical tests failed
        if: needs.critical.result == 'failure'
        run: exit 1
