name: Server Tests Base

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version'
        type: string
        default: '3.12'
      node-version:
        description: 'Node.js version'
        type: number
        default: 18
      frappe-user:
        description: 'Frappe repo user/org'
        type: string
        default: 'frappe'
      frappe-branch:
        description: 'Frappe branch'
        type: string
        default: 'version-15'
      erpnext-user:
        description: 'ERPNext repo user/org'
        type: string
        default: 'frappe'
      erpnext-branch:
        description: 'ERPNext branch'
        type: string
        default: 'version-15'
      parallel-runs:
        description: 'Number of parallel test containers'
        type: number
        default: 1
      enable-coverage:
        description: 'Enable coverage collection'
        type: boolean
        default: false

jobs:
  # Generate test indices for parallel execution
  generate-matrix:
    name: Generate Test Matrix
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.set-indices.outputs.indices }}
    steps:
      - id: set-indices
        run: |
          indices=$(seq -s ',' 1 ${{ inputs.parallel-runs }})
          echo "indices=[${indices}]" >> $GITHUB_OUTPUT

  # Main integration tests
  integration-tests:
    name: Tests (${{ matrix.index }}/${{ inputs.parallel-runs }})
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.generate-matrix.outputs.indices) }}

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: db_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # Host ports match frappe-bench's generated redis URLs
      # (redis_cache/redis_socketio=13000, redis_queue=11000). Service
      # containers stay up for the whole job, so the site setup steps
      # (reinstall / install-app) reach redis reliably — unlike a backgrounded
      # `bench start` honcho, which tears its redis down when a sibling process
      # exits, intermittently refusing connections at install-app time.
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      smtp:
        image: rnwood/smtp4dev:v3
        ports:
          - 2525:25
          - 3000:80

    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}
          node-version: ${{ inputs.node-version }}
          frappe-user: ${{ inputs.frappe-user }}
          frappe-branch: ${{ inputs.frappe-branch }}
          erpnext-user: ${{ inputs.erpnext-user }}
          erpnext-branch: ${{ inputs.erpnext-branch }}
          enable-coverage: ${{ inputs.enable-coverage }}

      - name: Run Tests
        run: |
          source ${GITHUB_WORKSPACE}/env/bin/activate
          # The suite has a large, long-standing red baseline (see
          # docs/plans/2026-05-29-server-tests-red-baseline-triage.md). We do NOT
          # fail the job on pre-existing failures here; the next step gates on
          # NEW failures only. `tee` captures output for that comparison; `|| true`
          # keeps a non-zero suite exit from failing this step.
          set -o pipefail
          bench --site test_site run-parallel-tests \
            --app ${{ github.event.repository.name }} \
            --total-builds ${{ inputs.parallel-runs }} \
            --build-number ${{ matrix.index }} \
            ${{ inputs.enable-coverage && '--with-coverage' || '' }} \
            2>&1 | tee "${GITHUB_WORKSPACE}/test_output_${{ matrix.index }}.txt" || true

      - name: Gate on new test failures
        run: |
          python3 "${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}/scripts/testing/check_new_test_failures.py" \
            --results "${GITHUB_WORKSPACE}/test_output_${{ matrix.index }}.txt" \
            --baseline "${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}/verenigingen/tests/known_test_failures.txt"

      - name: Upload Coverage
        # always() so coverage still uploads when the new-failure gate above
        # fails on the suite's known red baseline — otherwise Python coverage
        # would only ever reach Codecov on a fully green suite.
        if: ${{ inputs.enable-coverage && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.index }}
          path: |
            ${GITHUB_WORKSPACE}/sites/.coverage.*
            ${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}/coverage.xml
          include-hidden-files: true
          retention-days: 1

      - name: Upload Bench Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs-${{ matrix.index }}
          path: |
            ${GITHUB_WORKSPACE}/bench_start.log
            ${GITHUB_WORKSPACE}/logs/
            ${GITHUB_WORKSPACE}/test_output_${{ matrix.index }}.txt
          retention-days: 7

  # Coverage aggregation (optional)
  coverage:
    name: Aggregate Coverage
    needs: integration-tests
    runs-on: ubuntu-latest
    if: ${{ inputs.enable-coverage && always() }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Coverage Tool
        run: pip install coverage

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine Coverage
        run: |
          coverage combine
          coverage xml -o coverage.xml
          coverage report

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: false
          verbose: true
