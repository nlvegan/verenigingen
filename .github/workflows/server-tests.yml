name: Server Tests (GitHub Hosted)

# Runs the verenigingen test suite via bench run-parallel-tests, sharded
# across 4 matrix jobs. See Issue #66 and
# docs/plans/2026-05-23-ci-test-discovery-rewire-design.md for the history
# (the previous per-category matrix discovered 0 tests per job because
# each entry was a package path and Frappe's run-tests --module uses
# unittest.TestLoader.loadTestsFromModule() which does not recurse into
# subpackages).

on:
  push:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - 'pyproject.toml'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - 'pyproject.toml'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: 'Frappe branch to test against'
        required: false
        default: 'version-15'
      erpnext_branch:
        description: 'ERPNext branch to test against'
        required: false
        default: 'version-15'
      enable_coverage:
        description: 'Enable coverage collection'
        type: boolean
        default: true

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/_base-server-tests.yml
    # Pass org/repo secrets (CODECOV_TOKEN) through to the reusable workflow.
    secrets: inherit
    with:
      python-version: '3.12'
      # Node 20+ required by @tailwindcss/oxide (bench build); 18 broke the
      # Setup Environment step and red-lined this workflow.
      node-version: 20
      frappe-branch: ${{ inputs.frappe_branch || 'version-15' }}
      erpnext-branch: ${{ inputs.erpnext_branch || 'version-15' }}
      # 8 shards, not 4: the coverage-inflated suite is ~3.5 runner-hours, so
      # 4-way splitting left the heaviest shard >60min (the job timeout) — it
      # was over-budget, not hung (tests ran right up to the kill). The runner
      # already LPT-balances by test count; halving per-shard load brings every
      # shard well under the timeout. (Time-based balancing via a committed
      # test_timings.json is a possible future optimization.)
      parallel-runs: 8
      # On push/PR coverage is always collected; on manual dispatch the
      # checkbox still wins so you can run a fast, coverage-free dispatch.
      enable-coverage: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_coverage }}

  summary:
    name: Test Summary
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Result
        run: |
          status="${{ needs.tests.result }}"
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$status" == "success" ]; then
            echo ":white_check_mark: All test shards passed." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo ":x: Test run failed or was cancelled (result: $status). Check individual job logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
