name: Server Tests (GitHub Hosted)

# Runs the verenigingen test suite via bench run-parallel-tests, sharded
# across 4 matrix jobs. See Issue #66 and
# docs/plans/2026-05-23-ci-test-discovery-rewire-design.md for the history
# (the previous per-category matrix discovered 0 tests per job because
# each entry was a package path and Frappe's run-tests --module uses
# unittest.TestLoader.loadTestsFromModule() which does not recurse into
# subpackages).

on:
  push:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - 'pyproject.toml'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - 'pyproject.toml'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: 'Frappe branch to test against'
        required: false
        default: 'version-16'
      erpnext_branch:
        description: 'ERPNext branch to test against'
        required: false
        default: 'version-16'
      enable_coverage:
        description: 'Enable coverage collection'
        type: boolean
        default: true

concurrency:
  group: server-tests-${{ github.ref }}
  # Cancel a superseded PR run; never cancel a trunk run.
  #
  # What is lost without this is per-merge ATTRIBUTION, not verification. Of the
  # last 40 develop runs, 16 concluded `cancelled`, and every one of those 16
  # commits is a git-ancestor of a later develop commit whose run did conclude --
  # so the trunk HEAD was always tested, as part of a superset. What you cannot
  # do is say which merge broke it. The 08-12/13 chain is the case that matters:
  # five merges cancelled in a row, the terminal run red, and no way to tell
  # which of the five did it.
  #
  # `queue: max` is not optional here. With cancel-in-progress false, GitHub
  # holds at most ONE pending run per group and cancels older pending ones, so
  # gating the flag alone would trade cancelled-while-running for
  # cancelled-while-pending and add queueing latency on top. Simulated against
  # the real run history at the measured median duration (36.5 min, n=24 -- not
  # the "about an hour" this comment first claimed): flag alone gives 4 still
  # cancelled and 12 runs delayed by up to 36 min; with `queue: max`, 0.
  #
  # The burst case is the one to keep in mind: 6 of 39 gaps between develop runs
  # are under a minute, and on 2026-08-16 five pushes landed in 25 seconds.
  # Those serialise now. That is the deliberate trade -- attribution for
  # latency -- and `queue: max` is what keeps the tail of a burst from being
  # dropped instead of merely delayed.
  #
  # PRs are unaffected: `github.ref` is `refs/pull/<n>/merge` for pull_request
  # events, verified against this repo's own run history (PR runs on one branch
  # cancel each other; PR and develop runs overlap without cancelling), so they
  # never share a group with a trunk run.
  #
  # `main` is named because it is a push trigger above. It does not exist in this
  # repo today, so the clause is currently inert -- kept so the workflow does not
  # need editing if it is ever created.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
  queue: max

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/_base-server-tests.yml
    # Pass org/repo secrets (CODECOV_TOKEN) through to the reusable workflow.
    secrets: inherit
    with:
      python-version: '3.14'
      # Node 24+ required by frappe v16 (its package engines field declares
      # "node": ">=24"; the bench-build yarn step hard-fails on Node 20 with
      # "engine 'node' is incompatible ... Expected version '>=24'").
      node-version: 24
      frappe-branch: ${{ inputs.frappe_branch || 'version-16' }}
      erpnext-branch: ${{ inputs.erpnext_branch || 'version-16' }}
      # 12 shards, not 8 (and originally 4): the coverage-inflated suite keeps
      # growing (~3.5+ runner-hours), and at 8 the heaviest shard tipped back
      # over the 60min job timeout (run 27787769669, shard 5/8 ran right up to
      # the kill — over-budget, not hung). The runner LPT-balances by test
      # count, so adding shards lowers per-shard wall-clock; 12 brings the
      # heaviest shard well under the timeout with headroom for further growth.
      # Time-based balancing via the committed test_timings.json is now ACTIVE (the
      # setup action patches frappe's runner to read it), so the count-based
      # reasoning above describes why the shard count grew, not how work is split
      # today. Shards are still 12: the balancing changes how evenly the same work
      # is spread, not how much there is. Revisit lowering the count only after a
      # green run's job timings show the heaviest shard with real headroom - and
      # regenerate test_timings.json first, since a stale table quietly degrades
      # back toward count-based behaviour for every file missing from it.
      parallel-runs: 12
      # On push/PR coverage is always collected; on manual dispatch the
      # checkbox still wins so you can run a fast, coverage-free dispatch.
      enable-coverage: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_coverage }}

  summary:
    name: Test Summary
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Result
        run: |
          status="${{ needs.tests.result }}"
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$status" == "success" ]; then
            echo ":white_check_mark: All test shards passed." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo ":x: Test run failed or was cancelled (result: $status). Check individual job logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
