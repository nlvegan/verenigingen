name: Server Tests (GitHub Hosted)

# This workflow runs on GitHub-hosted runners using the Frappe CI pattern
# For self-hosted runner tests, see tests.yml

on:
  push:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: 'Frappe branch to test against'
        required: false
        default: 'version-15'
      erpnext_branch:
        description: 'ERPNext branch to test against'
        required: false
        default: 'version-15'
      parallel_runs:
        description: 'Number of parallel test containers'
        required: false
        default: '2'
      enable_coverage:
        description: 'Enable coverage collection'
        type: boolean
        default: false

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Quick validation before running expensive tests
  pre-check:
    name: Pre-flight Check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Python changes
        id: check
        run: |
          # Always run on workflow_dispatch or main/develop push
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if significant files changed
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Python Syntax Validation
        run: |
          python -m py_compile $(find verenigingen -name "*.py" -type f 2>/dev/null | head -100) || true

  # Main test suite
  tests:
    name: Server Tests
    needs: pre-check
    if: needs.pre-check.outputs.should_run == 'true'
    uses: ./.github/workflows/_base-server-tests.yml
    with:
      python-version: '3.12'
      node-version: 18
      frappe-branch: ${{ inputs.frappe_branch || 'version-15' }}
      erpnext-branch: ${{ inputs.erpnext_branch || 'version-15' }}
      parallel-runs: ${{ fromJSON(inputs.parallel_runs || '2') }}
      enable-coverage: ${{ inputs.enable_coverage || false }}

  # Critical tests (fast, always run)
  critical:
    name: Critical Tests
    needs: pre-check
    if: needs.pre-check.outputs.should_run == 'true'
    uses: ./.github/workflows/_base-server-tests.yml
    with:
      python-version: '3.12'
      node-version: 18
      frappe-branch: ${{ inputs.frappe_branch || 'version-15' }}
      erpnext-branch: ${{ inputs.erpnext_branch || 'version-15' }}
      parallel-runs: 1
      test-modules: 'verenigingen.tests.contracts'

  # Summary
  summary:
    name: Test Summary
    needs: [tests, critical]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.critical.result }}" == "success" ]; then
            echo "- Critical tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Critical tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.tests.result }}" == "success" ]; then
            echo "- Server tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Server tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if Critical Tests Failed
        if: needs.critical.result == 'failure'
        run: exit 1
