name: Server Tests (GitHub Hosted)

# Runs the verenigingen test suite via bench run-parallel-tests, sharded
# across 4 matrix jobs. See Issue #66 and
# docs/plans/2026-05-23-ci-test-discovery-rewire-design.md for the history
# (the previous per-category matrix discovered 0 tests per job because
# each entry was a package path and Frappe's run-tests --module uses
# unittest.TestLoader.loadTestsFromModule() which does not recurse into
# subpackages).

on:
  # #2184 flip: the full suite runs ONCE PER QUEUE BATCH, on the exact tree that lands.
  # - merge_group: runs the suite. develop's merge queue requires `Test Summary`.
  # - pull_request: the full `tests` job below is skipped there, but a SMALL pre-queue run
  #   (`select-pr-modules` + `pr-tests`: the PR's own test modules plus a fixed census of
  #   tree-scanning invariants) catches the defects that otherwise cost a ~50 minute queue
  #   build. `Test Summary` gates on it. No `paths:` on any trigger:
  #   a path-skipped workflow reports nothing, so a required check would never arrive.
  # - no push trigger: a develop push would re-run the suite the queue already ran on
  #   that tree. The old per-file path lists (#1113/#1189/#1541/#1550) go with it - the
  #   queue runs the suite unconditionally, so nothing can be filtered out of coverage.
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: 'Frappe branch to test against'
        required: false
        default: 'version-16'
      erpnext_branch:
        description: 'ERPNext branch to test against'
        required: false
        default: 'version-16'
      enable_coverage:
        description: 'Enable coverage collection'
        type: boolean
        default: true

concurrency:
  # Per ref. A pull_request run cancels its own superseded runs; every queue run has its
  # own gh-readonly-queue/... ref, so queue runs never cancel each other or a PR run. The
  # old per-commit group for trunk pushes went with the push trigger (#2184 flip).
  # merge_group: per-ref is right for the queue too (see above).
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # ~300 job-minutes per run, 63% of a full PR push's CI cost (#935). Runs in the merge
    # queue (and on workflow_dispatch), never on pull_request: the queue tests the batch on
    # the exact tree that lands, so a per-push PR run bought nothing the queue does not.
    # Skipping here is safe against the gate: a job skipped by `if:` reports success, and
    # `summary` below reports `Test Summary` (required) on every PR.
    # merge_group: the full suite RUNS in the queue - that is the point of #2184.
    # Coverage below is collected in the queue and on dispatch.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_base-server-tests.yml
    # Pass org/repo secrets (CODECOV_TOKEN) through to the reusable workflow.
    secrets: inherit
    with:
      python-version: '3.14'
      # Node 24+ required by frappe v16 (its package engines field declares
      # "node": ">=24"; the bench-build yarn step hard-fails on Node 20 with
      # "engine 'node' is incompatible ... Expected version '>=24'").
      node-version: 24
      frappe-branch: ${{ inputs.frappe_branch || 'version-16' }}
      erpnext-branch: ${{ inputs.erpnext_branch || 'version-16' }}
      # 12 shards, not 8 (and originally 4): the coverage-inflated suite keeps
      # growing (~3.5+ runner-hours), and at 8 the heaviest shard tipped back
      # over the 60min job timeout (run 27787769669, shard 5/8 ran right up to
      # the kill — over-budget, not hung). The runner LPT-balances by test
      # count, so adding shards lowers per-shard wall-clock; 12 brings the
      # heaviest shard well under the timeout with headroom for further growth.
      # Time-based balancing via the committed test_timings.json is now ACTIVE (the
      # setup action patches frappe's runner to read it), so the count-based
      # reasoning above describes why the shard count grew, not how work is split
      # today. Shards are still 12: the balancing changes how evenly the same work
      # is spread, not how much there is. Revisit lowering the count only after a
      # green run's job timings show the heaviest shard with real headroom - and
      # regenerate test_timings.json first, since a stale table quietly degrades
      # back toward count-based behaviour for every file missing from it.
      parallel-runs: 12
      # In the merge queue coverage is always collected; on manual dispatch the
      # checkbox still wins so you can run a fast, coverage-free dispatch.
      enable-coverage: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_coverage }}

  # Pre-queue census (pull_request only). The merge queue and dispatch run the whole suite;
  # a PR gets this subset on the merged tree, so a census/floor test in a module the PR never
  # touched (#2293) or an AST invariant over an edited test file (#2272) reddens the PR and
  # not a queue batch. Selection: scripts/testing/select_pr_test_modules.py (own changed test
  # modules + bounded derived ones + scripts/testing/pr_census_modules.txt).
  select-pr-modules:
    # merge_group: this job does not run in the queue (the full suite does); dispatch: neither.
    name: Select PR Test Modules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      # The default pull_request checkout is the MERGE of the PR into the current base tip, so
      # the selected modules run on the tree that would land. Its first parent is that base
      # tip, which makes `HEAD^1..HEAD` exactly the PR's own change (github.base.sha can be
      # stale when the base moved after the PR's last push). Full history: HEAD^1 is a
      # parent, and a shallow clone would be one fetch-depth mistake from an unusable diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select modules
        id: select
        run: |
          git rev-parse --verify -q HEAD^2 >/dev/null || { echo "::error::checkout is not a merge commit"; exit 1; }
          python3 scripts/testing/select_pr_test_modules.py \
            --base "$(git rev-parse HEAD^1)" --github-output "$GITHUB_OUTPUT"

  # Fail closed: an empty selection skips this job, and `summary` refuses a PR whose pr-tests
  # did not succeed. Without the `!= ''` guard an empty list would make the reusable workflow
  # run the WHOLE suite.
  pr-tests:
    # merge_group: skipped in the queue (see select-pr-modules); the full suite runs there.
    name: PR Tests (census and own modules)
    needs: select-pr-modules
    if: github.event_name == 'pull_request' && needs.select-pr-modules.outputs.modules != ''
    uses: ./.github/workflows/_base-server-tests.yml
    with:
      python-version: '3.14'
      node-version: 24
      parallel-runs: 1
      enable-coverage: false
      test-modules: ${{ needs.select-pr-modules.outputs.modules }}
      test-timeout-minutes: 45

  summary:
    name: Test Summary
    needs: [tests, select-pr-modules, pr-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Result
        run: |
          status="${{ needs.tests.result }}"
          pr_status="${{ needs.pr-tests.result }}"
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # merge_group: a queue run is not a pull_request, so it takes the full-suite branch below.
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # `tests` is skipped on a PR by design. What must have SUCCEEDED is pr-tests; a
            # skipped or failed select-pr-modules leaves it skipped, which is a failure too:
            # a PR that ran no census must not read green.
            if [ "$pr_status" == "success" ]; then
              echo ":white_check_mark: PR census and own test modules passed. The full suite runs in the merge queue." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo ":x: PR census run did not succeed (pr-tests: $pr_status, select-pr-modules: ${{ needs.select-pr-modules.result }})." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # `skipped` is the pull_request path from the gate on `tests`, not a failure: the
          # suite runs in the merge queue instead (#2184). Without this branch the
          # `if: always()` above would turn every PR red here.
          if [ "$status" == "skipped" ]; then
            echo ":fast_forward: Test suite skipped on the PR: it runs in the merge queue, on the tree that lands." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$status" == "success" ]; then
            echo ":white_check_mark: All test shards passed." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo ":x: Test run failed or was cancelled (result: $status). Check individual job logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
