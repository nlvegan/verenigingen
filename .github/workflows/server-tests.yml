name: Server Tests (GitHub Hosted)

# Runs the verenigingen test suite via bench run-parallel-tests, sharded
# across 4 matrix jobs. See Issue #66 and
# docs/plans/2026-05-23-ci-test-discovery-rewire-design.md for the history
# (the previous per-category matrix discovered 0 tests per job because
# each entry was a package path and Frappe's run-tests --module uses
# unittest.TestLoader.loadTestsFromModule() which does not recurse into
# subpackages).

on:
  push:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - 'pyproject.toml'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'verenigingen/**/*.py'
      - 'verenigingen/**/*.js'
      - 'pyproject.toml'
      - '.github/workflows/server-tests.yml'
      - '.github/workflows/_base-server-tests.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: 'Frappe branch to test against'
        required: false
        default: 'version-16'
      erpnext_branch:
        description: 'ERPNext branch to test against'
        required: false
        default: 'version-16'
      enable_coverage:
        description: 'Enable coverage collection'
        type: boolean
        default: true

concurrency:
  # A trunk push gets a group of its OWN, so no merge can cancel the run that is
  # verifying the merge before it. A pull_request keeps the per-ref group and so
  # keeps cancelling its own superseded runs.
  #
  # What was lost before this is per-merge ATTRIBUTION, not verification. Of the
  # last 40 develop runs, 16 concluded `cancelled`, and all 16 of those commits
  # are git-ancestors of a later develop commit whose run did conclude -- the
  # head was always tested, as part of a superset. What you could not do is say
  # WHICH merge broke it. The 08-12/13 chain is the case that matters: five
  # merges cancelled in a row, terminal run red, no way to attribute it.
  #
  # Why the group and not just `cancel-in-progress`. With cancel-in-progress
  # false, GitHub keeps at most ONE pending run per group and cancels older
  # pending ones, so gating the flag alone trades cancelled-while-running for
  # cancelled-while-pending and adds queueing latency on top -- simulated against
  # the real history at the measured median duration (36.5 min over 24 completed
  # runs, not the "about an hour" first claimed here): 4 still cancelled, 12
  # delayed by up to 36 min. `queue: max` would raise that limit, and is
  # documented, but this instance REJECTS the key -- pushing it produced a run
  # that died in 1 second with zero jobs ("workflow file issue"), which is what a
  # validation error looks like. Measured, not assumed. A per-commit group needs
  # no pending semantics at all: two trunk runs are never in the same group.
  #
  # Cost, stated: trunk runs now go in parallel rather than replacing each other.
  # 6 of 39 gaps between develop runs are under a minute -- five pushes landed
  # within 25 seconds on 2026-08-16 -- so a burst can put several 14-job suites
  # in flight at once. Those queue for runners at the ACCOUNT level, which
  # delays them rather than cancelling them, and can slow PR feedback during a
  # burst. That is the trade: runner contention for attribution.
  #
  # `github.ref` is `refs/pull/<n>/merge` for pull_request events, verified
  # against this repo's own history (PR runs on one branch cancel each other; PR
  # and develop runs overlap without cancelling), so PR and trunk never collide.
  group: server-tests-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/_base-server-tests.yml
    # Pass org/repo secrets (CODECOV_TOKEN) through to the reusable workflow.
    secrets: inherit
    with:
      python-version: '3.14'
      # Node 24+ required by frappe v16 (its package engines field declares
      # "node": ">=24"; the bench-build yarn step hard-fails on Node 20 with
      # "engine 'node' is incompatible ... Expected version '>=24'").
      node-version: 24
      frappe-branch: ${{ inputs.frappe_branch || 'version-16' }}
      erpnext-branch: ${{ inputs.erpnext_branch || 'version-16' }}
      # 12 shards, not 8 (and originally 4): the coverage-inflated suite keeps
      # growing (~3.5+ runner-hours), and at 8 the heaviest shard tipped back
      # over the 60min job timeout (run 27787769669, shard 5/8 ran right up to
      # the kill — over-budget, not hung). The runner LPT-balances by test
      # count, so adding shards lowers per-shard wall-clock; 12 brings the
      # heaviest shard well under the timeout with headroom for further growth.
      # Time-based balancing via the committed test_timings.json is now ACTIVE (the
      # setup action patches frappe's runner to read it), so the count-based
      # reasoning above describes why the shard count grew, not how work is split
      # today. Shards are still 12: the balancing changes how evenly the same work
      # is spread, not how much there is. Revisit lowering the count only after a
      # green run's job timings show the heaviest shard with real headroom - and
      # regenerate test_timings.json first, since a stale table quietly degrades
      # back toward count-based behaviour for every file missing from it.
      parallel-runs: 12
      # On push/PR coverage is always collected; on manual dispatch the
      # checkbox still wins so you can run a fast, coverage-free dispatch.
      enable-coverage: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_coverage }}

  summary:
    name: Test Summary
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Result
        run: |
          status="${{ needs.tests.result }}"
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$status" == "success" ]; then
            echo ":white_check_mark: All test shards passed." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo ":x: Test run failed or was cancelled (result: $status). Check individual job logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
