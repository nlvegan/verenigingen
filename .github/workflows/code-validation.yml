  # A copy-pasted helper is where a fix goes to die. On 2026-08-19 that shape
  # produced four defects in one day -- each a fix applied to one copy, with a
  # comment explaining why, while its siblings kept the bug (#392, #394, #399, plus
  # two branches independently fixing the same test and colliding on merge).
  # This does not stop the copies that already exist; it stops new ones.
  duplicate-helper-ratchet:
    name: 👯 Duplicate Helper Guard (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Needed by the growth check below, which diffs against the base branch.
        fetch-depth: 0

