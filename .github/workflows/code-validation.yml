    # Stdlib-only (ast, os, argparse): no bench, no site, no install.
    #
    # WHY THIS GATE IS COUNT-ONLY AND DOES NOT BLOCK ON EXISTING SITES
    # ----------------------------------------------------------------
    # #815 is the reason this exists, and also the reason it does not sweep. The
    # bare `frappe.db.commit()` there was a TRIGGER, not the cause -- the actual
    # defect was a shard-global cache on frappe.local (#817). Removing that commit
    # broke 16 of its own module's 24 tests, because it was load-bearing for the
    # naming-series deadlock its docstring describes. So a bare commit is a WEAK
    # predictor of harm: 1005 findings, one known defect. Blocking new ones is
    # worth it; demanding the debt be paid would convert a latent ordering risk
    # into hundreds of red tests.
    #
    # Upward-only, matching bf379a4fe: growth fails, pure shrinkage self-heals.
    # No --require-marker: this step compares the WHOLE file, so any change --
    # COMMIT, REUSE, or COMMIT_EXEMPT (#825) -- requires a baseline update commit,
    # unlike the duplicate-helper baseline where unmarked name collisions are
    # deliberately recorded rather than blocked. COMMIT_EXEMPT entries are still
    # visible here; they are excluded only from the SEPARATE no-growth total below,
    # via their own trailing marker that step's grep does not match -- see
    # scan_order_dependence.py's module docstring ("FIXED -- #825").
    - name: Baseline is in sync with the tree
      env:
        FAIL_ON_SHRINK: ${{ github.event_name != 'pull_request' && '--fail-on-shrink' || '' }}
      run: |
        BASELINE=scripts/validation/order_dependence_baseline.txt
        REGEN="python scripts/testing/scan_order_dependence.py --update-baseline $BASELINE"
        $REGEN
        python scripts/validation/baseline_shrink_gate.py "$BASELINE" "$REGEN" --already-regenerated $FAIL_ON_SHRINK

    # The step above CANNOT catch the one abuse that defeats this gate: regenerating the
    # baseline in the same PR so a new finding is recorded rather than fixed. It compares
    # the regenerated file against `git show HEAD:<path>` -- the PR's OWN committed
    # baseline -- so a contributor who runs --update-baseline and commits both files stays
    # green. Reproduced during review: self-baselined probe -> exit 0; the same probe
    # without self-baselining -> exit 1. So the shrink gate bites the honest mistake and
    # not the dishonest one.
    #
    # base.sha is the PR's merge base and cannot be rewritten from inside the PR, which is
    # what makes this step independent. Every sibling ratchet in this file carries the same
    # step for the same reason; omitting it here was an oversight, not a tradeoff.
    - name: Baseline did not grow
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        BASELINE=scripts/validation/order_dependence_baseline.txt
        SCANNER=scripts/testing/scan_order_dependence.py
        total() { grep -e '# order-dependence' | awk -F'::' '{s+=$2+0} END {print s+0}'; }

        if ! git cat-file -e "$BASE_SHA:$BASELINE" 2>/dev/null; then
          echo "No baseline on the base branch yet - nothing to compare."
          exit 0
        fi
        if ! git diff --quiet "$BASE_SHA" HEAD -- "$SCANNER"; then
          echo "Scanner changed in this PR, so a different census is expected."
          exit 0
        fi

        before=$(git show "$BASE_SHA:$BASELINE" | total)
        after=$(total < "$BASELINE")
        echo "order-dependence findings: base=$before  head=$after"
        if [ "$after" -gt "$before" ]; then
          echo "::error file=$BASELINE::Order-dependence findings grew from $before to $after without a scanner change."
          echo "A new order-dependence site was recorded into the baseline instead of avoided."
          echo "See #815: a bare frappe.db.commit() in test setup made another module's rows"
          echo "permanent and broke a test three modules later."
          exit 1
        fi

  fast-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pathlib

    - name: Fast Field Validation (PR Check)
      id: validation
      run: |
        cd scripts/validation
        python enhanced_field_reference_validator.py --pre-commit || echo "Field validation completed with issues"

    - name: Comment PR Results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const outcome = '${{ steps.validation.outcome }}';
          const body = outcome === 'success'
            ? '✅ **Code Validation**: All database field references are valid!'
            : '❌ **Code Validation**: Some database field references need attention. Please check the validation logs.';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  # Same reason as the swallowed-exception ratchet above: the pre-commit hook can
  # be skipped (`git commit -n`, `SKIP=`) and only ever sees the files in one
  # commit. This is a HARD GATE, not a ratchet with a baseline -- #596 emptied the
  # census to zero, so there is nothing pre-existing to grandfather in and any
  # finding here is a fresh instance of the same bug class.
  child-doctype-validate-guard:
    name: 🧟 Dead Child-Validate Guard (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # Stdlib-only (ast, json, argparse, pathlib) by design: no bench, no site,
    # no dependency install.
    - name: Unit-test the guard itself
      run: python -m unittest discover -s scripts/validation/tests -p 'test_child_doctype_validate_guard.py' -v

    - name: Whole-tree check
      run: python scripts/validation/child_doctype_validate_guard.py

  # A literal .append("<child_table>", {...}) dict that sets a Dynamic Link
  # field's value without its companion doctype field persists a silent NULL
  # and no exception at all when written through anything that bypasses
  # Document._save() (update_child_table(), and this app's own
  # safe_child_table_update() wrapper around it) -- see #667. Same reasoning
  # as the guard above: the pre-commit hook can be skipped, and only ever
  # sees the files in one commit. HARD GATE, not a ratchet -- the census on
  # this branch is zero after fixing #667's four sites.
  dynamic-link-append-validator:
    name: 🔗 Dynamic Link Append Guard (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # Stdlib-only (ast, json, argparse, pathlib) by design: no bench, no site,
    # no dependency install.
    - name: Unit-test the guard itself
      run: python -m unittest discover -s scripts/validation/tests -p 'test_dynamic_link_append_validator.py' -v

    - name: Whole-tree check
      run: python scripts/validation/dynamic_link_append_validator.py

  # The former `integration-test` job was deleted in PR #53.
  # It invoked scripts/testing/runners/validation_test_runner.py, which was
  # removed on 2026-03-03 by the test-suite Phase 1 dead-code sweep (commit
  # a60d1870). Pre-deletion, that wrapper duplicated the field / template /
  # child-table validators the sibling `validation` job above already runs
  # directly; its custom-test-scripts stage iterated a nonexistent smoke
  # file and returned True. So no coverage is lost by removing the wrapper -
  # `validation` above remains the real gate.
  #
  # Real bench-driven integration testing lives in `_base-server-tests.yml`
  # under a separate job named `integration-tests` (plural) - not to be
  # confused with this deleted job.
