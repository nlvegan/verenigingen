    # leave the developer the same dead end -- rename the method -- by another door.
    - name: Clone-family copies did not grow
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        BASELINE=scripts/validation/duplicate_helper_baseline.txt
        VALIDATOR=scripts/validation/duplicate_helper_validator.py
        total() { grep -e '# clone family' | awk -F'::' '{s+=$2+0} END {print s+0}'; }

        if ! git cat-file -e "$BASE_SHA:$BASELINE" 2>/dev/null; then
          echo "No baseline on the base branch yet — nothing to compare."
          exit 0
        fi
        if ! git diff --quiet "$BASE_SHA" HEAD -- "$VALIDATOR"; then
          echo "Validator changed in this PR, so a different baseline is expected."
          exit 0
        fi

        before=$(git show "$BASE_SHA:$BASELINE" | total)
        after=$(total < "$BASELINE")
        echo "clone-family copies: base=$before  head=$after"
        if [ "$after" -gt "$before" ]; then
          echo "::error file=$BASELINE::Clone-family copies grew from $before to $after without a validator change."
          echo "A near-identical helper was recorded into the baseline instead of consolidated."
          exit 1
        fi
        echo "Clone-family copies did not grow."

