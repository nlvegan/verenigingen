name: Code Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  # A per-REF group, unlike server-tests.yml's per-COMMIT group for trunk pushes.
  # server-tests.yml deliberately gives every trunk push its own group so that no
  # merge cancels the run verifying the merge before it -- that buys per-merge
  # ATTRIBUTION, at the cost of runner contention, and its own comment says so.
  #
  # That trade is only worth paying for the 14-job test suite. For this workflow a
  # superseded trunk run tells you nothing the newer one does not, so collapse them:
  # a newer push to the same ref cancels the older run. On a pull_request `github.ref`
  # is refs/pull/<n>/merge, so PR runs still cancel only their own supersedes and
  # never collide with trunk.
  #
  # Added 2026-09-05: develop took ~7 merges in 70 minutes and each fired 5-6
  # workflows with no concurrency group at all, leaving 43 of 83 active runs on
  # develop alone and jobs queued 5h+ without ever being assigned a runner.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validation:
    runs-on: ubuntu-latest
    # Was 10: the new scripts/validation/tests catch-all step below measured
    # ~6.5 minutes locally (525 tests, dominated by two real-repo/real-doctype
    # scans at ~75-80s each) on top of the ~3s the existing steps take, leaving
    # too little headroom against a slower CI runner.
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install minimal dependencies needed for validation
        pip install pathlib

    - name: Run Database Field Validation
      id: field-validation
      run: |
        cd scripts/validation
        python enhanced_field_reference_validator.py --pre-commit || echo "Field validation completed with issues"
      continue-on-error: true

    - name: Run Template Variable Validation
      id: template-validation
      if: success() || failure()
      run: |
        cd scripts/validation
        python template_variable_validator.py || echo "Template validation completed with issues"
      continue-on-error: true

    - name: Run Child Table Validation
      if: success() || failure()
      run: |
        cd scripts/validation
        python child_table_creation_validator.py || echo "Child table validation completed with issues"
      continue-on-error: true

    # Catch-all for scripts/validation/tests (#1068): every step below this one in
    # this file, and every "Unit-test X" step in the ratchet jobs further down,
    # names ONE exact filename to `unittest discover -p`, which discovers nothing
    # for any other file in the directory. There is no catch-all anywhere --
    # .github/workflows/, .pre-commit-config.yaml, Makefile and pytest.ini were all
    # grepped -- so a new test file runs only if someone also adds a new named
    # step, and in practice this was skipped 8 times (measured 2026-09-07): six
    # validators' tests never ran at all, and two heavier ones
    # (production_divergence_scanner's real-repo scan, doctype_name_validator's
    # full self-check) never ran either, at ~75-80s each.
    #
    # Deliberately ADDITIVE, not a replacement for the named steps below: those
    # each live in their own dedicated job (swallowed-exception-ratchet,
    # log-error-arg-order-ratchet, ...) and a failure there names the validator
    # family at a glance. Collapsing them into this one step would trade that
    # per-job attribution for a single job whose log you have to open to see
    # which validator broke -- a real loss of granularity for zero gain, since
    # this step runs anyway. So the 14 already-named files get run TWICE (here,
    # and in their own job) -- harmless duplication, not a masked signal -- while
    # this step is the only thing that will ever catch a FUTURE file added here
    # without a matching named step.
    #
    # ~6.5 minutes locally (525 tests), inside this job's existing 10-minute
    # budget alongside the ~3s of validators above.
    #
    # scripts/testing/tests already has its own catch-all (`-p 'test_*.py'`,
    # see the swallowed-exception-ratchet job) and does not need one here.
    #
    # NOT included: scripts/optimization/tests, scripts/security/tests,
    # scripts/analysis/tests (added by #1064). All three `import frappe` --
    # directly, or via the validator module they exec -- and this job installs
    # no frappe (see "Install dependencies" above): every one of them fails
    # collection with `ModuleNotFoundError: No module named 'frappe'` before a
    # single test runs. Filed as #1079 rather than patched here; wiring them in
    # needs either a real frappe install in this deliberately frappe-free job or
    # removing frappe as a module-load-time dependency from five production
    # scripts, both out of scope for a workflow-wiring fix.
    # TODO(#1079): wire scripts/optimization/tests, scripts/security/tests and
    # scripts/analysis/tests once that is resolved.
    - name: Unit-test scripts/validation/tests (catch-all)
      run: python -m unittest discover -s scripts/validation/tests -p 'test_*.py' -v

    - name: Validation Summary
      if: always()
      run: |
        echo "## Code Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.field-validation.outcome }}" == "success" ]; then
          echo "✅ **Database Field Validation**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Database Field Validation**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ steps.template-validation.outcome }}" == "success" ]; then
          echo "✅ **Template Variable Validation**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Template Variable Validation**: FAILED (warnings allowed)" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Performance Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- Validation completed in under 10 minutes" >> $GITHUB_STEP_SUMMARY
        echo "- Field validation: ~1s (764 Python files)" >> $GITHUB_STEP_SUMMARY
        echo "- Template validation: ~2s (62 templates)" >> $GITHUB_STEP_SUMMARY

  # KNOWN, ACCEPTED GAP shared by every ratchet job below: a branch's own baseline
  # is a statement about the tree its CI actually checked -- `actions/checkout` on
  # a `pull_request` event checks out GitHub's auto-generated test-merge commit
  # (the PR head merged into the base branch's CURRENT tip), so a PR's checks do
  # reflect the freshest base AT THE TIME THEY RUN. What they cannot see is a
  # second PR that lands on develop AFTER that run finished. This is exactly how
  # #732 happened: its baseline was correct against the develop tip its own CI
  # checked, but #719 and #730 each deleted a different baselined call site
  # afterwards, and nothing re-validates an already-green, already-merged PR's
  # baseline against what actually shipped alongside it.
  #
  # That race is generic to per-PR CI on a fast-moving trunk (a merge queue is the
  # usual fix) and is not something a script in this directory or a job in this
  # file can close by itself -- so this is documented, not patched. What IS in
  # scope, and IS fixed (#750 / see baseline_shrink_gate.py), is bounding the
  # damage: the resulting staleness is pure shrinkage, and now self-heals instead
  # of reddening every unrelated branch cut from develop until someone notices
  # and reruns `--update-baseline` by hand.
  #
  # Unlike the advisory steps in `validation` above, this one is a HARD GATE.
  # It is a ratchet: it fails only on log-and-swallow sites that are not already
  # in scripts/validation/error_swallow_baseline.txt, so it cannot go red from
  # pre-existing code — only from something the PR adds.
  #
  # It exists as a CI job and not only as a pre-commit hook because the hook can
  # be skipped with `git commit -n` (or SKIP=), and because the hook only ever
  # sees the files in one commit; this scans the whole tree.
  swallowed-exception-ratchet:
    name: 🕳️ Swallowed-Exception Guard (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Needed by the growth check below, which diffs against the base branch.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # The validator is stdlib-only (ast, argparse, pathlib) by design, so this job
    # needs no bench, no site, and no dependency install.
    - name: Unit-test the validator itself
      run: python -m unittest discover -s scripts/validation/tests -p 'test_error_swallow_validator.py' -v

    # The harness-method-shadow guard (#496). A test-local helper sharing a name with
    # a method on EnhancedTestCase / VereningingenTestCase overrides it, so the harness's
    # own `self.<name>(...)` calls dispatch to the wrong implementation via MRO -- the
    # shape that killed 38/38 tests in one module for 12 days (#194).
    #
    # It runs here and not only in .pre-commit-config.yaml for the reason the siblings
    # above already give: a pre-push hook is skippable with --no-verify, and a
    # contributor who never installed the hooks gets no enforcement at all. Without this
    # job the guard's own 8 tests would run nowhere automatically, so a regression in
    # its import resolution would be silent -- which is the exact defect class the guard
    # exists to prevent.
    #
    # Stdlib-only (ast, pathlib) like its siblings, so no bench and no site needed.
    - name: Unit-test the harness-method-shadow guard
      run: python -m unittest discover -s scripts/validation/tests -p 'test_harness_method_shadow_validator.py' -v

    - name: Run the harness-method-shadow guard over the tree
      run: python scripts/validation/harness_method_shadow_validator.py

    # The submittability-drift guard (#987, ancestor #350). Frappe's
    # Document._submit()/._cancel() carry no is_submittable guard, so a doctype
    # whose own DocType JSON says is_submittable=0 can still be submitted/cancelled,
    # have on_submit/on_cancel hooks registered for it, or be filtered by
    # docstatus -- and #350/#987 both found production code that had drifted into
    # exactly that. Ratcheted against submittability_drift_baseline.txt (18 known
    # sites) so this job blocks only NEW drift, not the ones already tracked.
    #
    # This job's checkout has no apps/erpnext, apps/hrms, etc. (standalone app
    # checkout, no bench ancestor), so the validator resolves doctypes from THIS
    # app's own JSONs only here -- a genuinely submittable ERPNext/HRMS doctype
    # (Sales Invoice, Payment Entry, ...) is reported UNRESOLVED, never as a
    # violation, so that gap does not cry wolf; see the module's own docstring.
    #
    # Stdlib-only (ast, json, pathlib) like its siblings, so no bench and no site
    # needed.
    - name: Unit-test the submittability-drift guard
      run: python -m unittest discover -s scripts/validation/tests -p 'test_submittability_drift_validator.py' -v

    - name: Run the submittability-drift guard over the tree
      run: python scripts/validation/submittability_drift_validator.py

    # #1031: this guard used to run bare, so a PR that fixed a drift site without
    # regenerating the baseline left the freed slot as permanent slack -- a NEW
    # violation of the same (file, rule, doctype) key was silently absorbed instead
    # of blocked. Five sibling ratchets (error_swallow, log_error_arg_order,
    # test_quality, duplicate_helper, order_dependence) already route through
    # baseline_shrink_gate.py for exactly this reason; this one did not. Same shape
    # as test_quality_enforcer's pair of steps below: no `--check-shrink` equivalent
    # of its own here either, so a shrink caused by something other than a genuine
    # fix (a site moved out of the scanned roots, say) would also self-heal
    # undetected -- see baseline_shrink_gate.py's module docstring.
    - name: Baseline is in sync with the tree
      env:
        FAIL_ON_SHRINK: ${{ github.event_name != 'pull_request' && '--fail-on-shrink' || '' }}
      run: |
        python scripts/validation/submittability_drift_validator.py --update-baseline
        python scripts/validation/baseline_shrink_gate.py \
          scripts/validation/submittability_drift_baseline.txt \
          "python scripts/validation/submittability_drift_validator.py --update-baseline" \
          --already-regenerated \
          $FAIL_ON_SHRINK

    # The step above cannot catch the abuse that actually defeats this gate:
    # regenerating the baseline so a NEW violation is recorded rather than fixed.
    # That leaves baseline and tree perfectly in sync, and the ratchet green. The
    # only signal is that the baseline GREW, which is legitimate solely when the
    # validator's own detection rules changed in the same PR.
    - name: Baseline did not grow
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        BASELINE=scripts/validation/submittability_drift_baseline.txt
        VALIDATOR=scripts/validation/submittability_drift_validator.py
        total() { grep -v -e '^#' -e '^$' | awk -F'::' '{s+=$NF} END {print s+0}'; }

        if ! git cat-file -e "$BASE_SHA:$BASELINE" 2>/dev/null; then
          echo "No baseline on the base branch yet — nothing to compare."
          exit 0
        fi
        if ! git diff --quiet "$BASE_SHA" HEAD -- "$VALIDATOR"; then
          echo "Validator changed in this PR, so a larger baseline is expected."
          echo "Review the added entries by hand — they are new DETECTIONS, not new code."
          exit 0
        fi

        before=$(git show "$BASE_SHA:$BASELINE" | total)
        after=$(total < "$BASELINE")
        echo "baseline sites: base=$before  head=$after"
        if [ "$after" -gt "$before" ]; then
          echo "::error file=$BASELINE::Baseline grew from $before to $after without a validator change."
          echo "A new submittability-drift site was recorded into the baseline instead of fixed."
          exit 1
        fi
        echo "Baseline did not grow."

    # The failed-write guard is the sibling rule (a broad except around a DATABASE
    # WRITE whose failure never reaches the caller). It is ADVISORY for now, so it
    # gets no ratchet/growth gate here — only its unit tests, which are stdlib-only
    # and include a check that the tree is still at or below its baseline.
    - name: Unit-test the failed-write guard
      run: python -m unittest discover -s scripts/validation/tests -p 'test_failed_write_validator.py' -v

    # The class-teardown harness-logger census. verenigingen/tests/harness_logger.py
    # justifies its `>= ERROR` mirror gate with a count of which teardown routes log
    # at which level; that figure was wrong twice (#564, #571) because nobody could
    # re-run it. Stdlib-only like its siblings, so it runs here rather than in the
    # Frappe shards -- a whole-tree AST walk is ~20s and shards re-pack on runtime.
    - name: Unit-test the harness-logger teardown census
      run: python -m unittest discover -s scripts/validation/tests -p 'test_harness_logger_teardown_census.py' -v

    # The shared bench-root resolver used by doctype_name_validator.py,
    # import_path_validator.py and child_table_creation_validator.py (#752).
    # Stdlib-only (pathlib, subprocess, git) like its siblings -- the one test
    # that needs a REAL bench (running doctype_name_validator.py --self-check
    # from a worktree outside it) lives in
    # verenigingen/tests/test_doctype_name_ratchet.py instead, where a full
    # bench actually exists.
    - name: Unit-test the shared bench-root resolver
      run: python -m unittest discover -s scripts/validation/tests -p 'test_bench_resolution.py' -v

    # The shared "does the regenerated baseline match the tree" gate used by the
    # four "Baseline is in sync with the tree" steps below (and by test_quality/
    # duplicate_helper further down). Stdlib-only, no bench, no site -- same
    # reason as its siblings above.
    - name: Unit-test the shared baseline shrink gate
      run: python -m unittest discover -s scripts/validation/tests -p 'test_baseline_shrink_gate.py' -v

    # Guards the CI JS installer / package.json pin parity (#272): the
    # installer must pick yarn vs npm per app (this app has no yarn.lock and
    # is npm-managed, unlike frappe/erpnext/hrms/builder), and package.json
    # must carry no dead `resolutions` block that can drift from the
    # `overrides` block npm actually reads. Stdlib-only, no bench needed.
    - name: Unit-test the JS installer / pin-parity validator
      run: python -m unittest discover -s scripts/validation/tests -p 'test_js_installer_pin_parity_validator.py' -v

    - name: Check JS installer / package.json pin parity
      run: python scripts/validation/js_installer_pin_parity_validator.py

    # Tests for the scripts/testing tools live outside the verenigingen package, and
    # get_all_tests() only walks apps/verenigingen/verenigingen, so the app suite never
    # sees them -- they were added green and unrun, and a location-dependent test in them
    # went unnoticed until the script was invoked from its installed path. Run them here,
    # where the rest of the scripts/ tests already run.
    #
    # The pattern is test_*.py, not one named file: pinning it to a single name is how a
    # second test module would repeat the "added green and unrun" failure this comment
    # exists to describe.
    - name: Unit-test the scripts/testing tools
      run: python -m unittest discover -s scripts/testing/tests -p 'test_*.py' -v

    - name: Ratchet check (whole tree)
      run: python scripts/validation/error_swallow_validator.py

    # A ratchet that never tightens is not a ratchet. If someone fixes a swallow
    # without regenerating, the baseline keeps a ceiling that is higher than the
    # tree, and the removed slot can be silently refilled later.
    #
    # baseline_shrink_gate.py distinguishes growth (new/higher sites -- a real
    # failure) from pure shrinkage (a baselined site was deleted or fixed).
    # See its docstring and #750: without this, deleting a baselined swallow
    # site left the baseline stale and reddened every unrelated branch cut
    # from develop afterwards. On `pull_request` this self-heals (the
    # auto-merge checkout already reflects any prior shrinkage); on `push`
    # (this commit already landed, nothing downstream to protect) it still
    # fails with the exact entries, since that failure is the only thing
    # left that forces the committed baseline to ever tighten.
    - name: Baseline is in sync with the tree
      env:
        FAIL_ON_SHRINK: ${{ github.event_name != 'pull_request' && '--fail-on-shrink' || '' }}
      run: |
        python scripts/validation/error_swallow_validator.py --update-baseline
        python scripts/validation/baseline_shrink_gate.py \
          scripts/validation/error_swallow_baseline.txt \
          "python scripts/validation/error_swallow_validator.py --update-baseline" \
          --already-regenerated \
          $FAIL_ON_SHRINK

    # The step above cannot catch the one abuse that actually defeats this gate:
    # regenerating the baseline so a NEW finding is recorded rather than fixed.
    # That leaves baseline and tree perfectly in sync — and the ratchet green.
    # The only signal is that the baseline GREW, which is legitimate solely when
    # the validator's own detection rules changed in the same PR.
    - name: Baseline did not grow
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        BASELINE=scripts/validation/error_swallow_baseline.txt
        VALIDATOR=scripts/validation/error_swallow_validator.py
        total() { grep -v -e '^#' -e '^$' | awk -F'::' '{s+=$NF} END {print s+0}'; }

        if ! git cat-file -e "$BASE_SHA:$BASELINE" 2>/dev/null; then
          echo "No baseline on the base branch yet — nothing to compare."
          exit 0
        fi
        if ! git diff --quiet "$BASE_SHA" HEAD -- "$VALIDATOR"; then
          echo "Validator changed in this PR, so a larger baseline is expected."
          echo "Review the added entries by hand — they are new DETECTIONS, not new code."
          exit 0
        fi

        before=$(git show "$BASE_SHA:$BASELINE" | total)
        after=$(total < "$BASELINE")
        echo "baseline sites: base=$before  head=$after"
        if [ "$after" -gt "$before" ]; then
          echo "::error file=$BASELINE::Baseline grew from $before to $after without a validator change."
          echo "A new log-and-swallow site was recorded into the baseline instead of fixed."
          echo "Either fix the handler, or mark it deliberately:"
          echo "    except Exception:  # swallow-ok: best-effort"
          exit 1
        fi
        echo "Baseline did not grow."

    # The other direction is the one that actually shipped. A SHRINK was accepted
    # without question, and #586 is what that costs: a handler changed its return
    # from `None` to `InvoiceChoice(None, 0)` -- same swallow, still logging, no
    # behavioural change -- and the entry silently LEFT the baseline. The remedy the
    # step above prints is `--update-baseline`, and the resulting diff shows a REMOVED
    # line, so both read as progress.
    #
    # Deliberately NOT exempted when the validator changes, unlike the growth gate:
    # a validator PR is exactly where a detection rule can be narrowed by accident,
    # and this is the only step that would say so. It distinguishes three reasons an
    # entry can leave without being fixed -- the falsy test no longer recognising the
    # return, the logging call being DELETED (which makes it a silent swallow, worse
    # than what was recorded), and the file dropping out of the SCAN. That last one
    # matters because `.pre-commit-config.yaml` couples its `exclude` to SCAN_ROOTS by
    # hand: measured, excluding `templates/` silently dropped 10 baselined entries and
    # dropping the `scripts` root dropped 33.
    #
    # Known limit: the explainer shares the validator's own structural predicates, so
    # narrowing `_is_broad` or `LOG_NAMES` is invisible to it. It sees a narrowing of
    # the falsy test -- the heuristic, which has now been widened twice.
    - name: Every shrink was actually a fix
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        BASELINE=scripts/validation/error_swallow_baseline.txt
        if ! git cat-file -e "$BASE_SHA:$BASELINE" 2>/dev/null; then
          echo "No baseline on the base branch yet — nothing to compare."
          exit 0
        fi
        git show "$BASE_SHA:$BASELINE" > "$RUNNER_TEMP/base_swallow_baseline.txt"
        # The base TREE, not just its baseline. Deleting a logging call takes an entry
        # out of the baseline while making the code worse, and from the head tree alone
        # that is indistinguishable from a function that always had a silent sibling --
        # 2 of 443 baselined functions do, and reporting those turned the CORRECT fix
        # into a red gate citing a deletion that never happened.
        git worktree add --detach "$RUNNER_TEMP/base_tree" "$BASE_SHA" >/dev/null
        python scripts/validation/error_swallow_validator.py \
          --check-shrink "$RUNNER_TEMP/base_swallow_baseline.txt" \
          --base-tree "$RUNNER_TEMP/base_tree"

  # expectErrorLog() only mutes the harness's automatic tearDown check; it asserts
  # nothing (#1112). A test named "..._logs_..." that declared it and nothing else
  # passed whether or not the log was written -- found after #1105 deleted a
  # security-relevant frappe.log_error and its test stayed green, 33/33. Unlike the
  # ratchets above this one is BASELINE-FREE: the population is 0, so it gates at 0.
  vacuous-log-test-ratchet:
    name: 🔇 Vacuous Log-Claiming Test Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # Stdlib-only (ast, argparse, pathlib) by design: no bench, no site, no install.
    - name: Unit-test the validator itself
      run: |
        python -m unittest discover -s scripts/validation/tests \
          -p 'test_vacuous_error_log_test_validator.py' -v

    # Zero-tolerance and BASELINE-FREE: every known instance is fixed (#1116 for
    # 18, #1103 for 2, this PR for 3 more), so the tree-wide count must stay 0.
    # A baseline here would be pure ratchet debt (#985) and would inherit the
    # shrink-gate defect in #1110. See the validator's docstring.
    - name: Vacuous log-claiming test check (whole tree)
      run: python scripts/validation/vacuous_error_log_test_validator.py

  # frappe.log_error is (title, message) -- frappe/utils/error.py:44. This app calls
  # it the other way round positionally at roughly 1100 sites (#602): the swapped
  # "title" (the real, dynamic message) gets truncated to 140 chars, and the real
  # traceback is never recorded, because frappe's own swap-detection heuristic only
  # fires when the (wrongly positioned) title argument contains a newline. Same
  # ratchet shape as the swallowed-exception guard above: a hook-only gate can be
  # skipped with `git commit -n`, and only ever sees one change's files.
  log-error-arg-order-ratchet:
    name: 🔄 log_error Argument Order Guard (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Needed by the growth check below, which diffs against the base branch.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # Stdlib-only (ast, argparse, pathlib) by design: no bench, no site, no install.
    - name: Unit-test the validator itself
      run: python -m unittest discover -s scripts/validation/tests -p 'test_log_error_arg_order_validator.py' -v

    - name: Ratchet check (whole tree)
      run: python scripts/validation/log_error_arg_order_validator.py

    # A ratchet that never tightens is not a ratchet. If someone fixes a swap
    # without regenerating, the baseline keeps a ceiling higher than the tree, and
    # the removed slot can be silently refilled later.
    #
    # baseline_shrink_gate.py distinguishes growth (new/higher sites -- a real
    # failure) from pure shrinkage (a baselined site was deleted or fixed).
    # This is the exact defect #750 patched by hand: two sites deleted by
    # #719/#730 left this baseline stale, and "every branch cut from that
    # trunk inherited the failure" on a job that never touched logging. As
    # with the swallow guard above, this self-heals on `pull_request` and
    # fails (naming the exact entries) on `push`, where it is the only
    # remaining forcing function that tightens the committed baseline.
    - name: Baseline is in sync with the tree
      env:
