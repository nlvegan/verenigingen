    - name: Unit-test the validator itself
      run: python -m unittest discover -s scripts/validation/tests -p 'test_duplicate_helper_validator.py' -v

    - name: Ratchet check (whole tree)
      run: python scripts/validation/duplicate_helper_validator.py

