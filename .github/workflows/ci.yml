name: Verenigingen CI

on:
  # #2184: queue runs. Inert until develop's ruleset enables the merge queue - no
  # merge_group event fires before that. No `paths:` here on purpose: the queue
  # needs every required check to REPORT, and a path-skipped workflow reports nothing.
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  # A per-REF group, unlike server-tests.yml's per-COMMIT group for trunk pushes.
  # server-tests.yml deliberately gives every trunk push its own group so that no
  # merge cancels the run verifying the merge before it -- that buys per-merge
  # ATTRIBUTION, at the cost of runner contention, and its own comment says so.
  #
  # That trade is only worth paying for the 14-job test suite. For this workflow a
  # superseded trunk run tells you nothing the newer one does not, so collapse them:
  # a newer push to the same ref cancels the older run. On a pull_request `github.ref`
  # is refs/pull/<n>/merge, so PR runs still cancel only their own supersedes and
  # never collide with trunk.
  #
  # Added 2026-09-05: develop took ~7 merges in 70 minutes and each fired 5-6
  # workflows with no concurrency group at all, leaving 43 of 83 active runs on
  # develop alone and jobs queued 5h+ without ever being assigned a runner.
  # merge_group: per-ref is right for the queue - every queue run has its own
  # gh-readonly-queue/... ref, so queue runs never cancel each other or a PR run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install linting dependencies
      run: |
        pip install black isort flake8 bandit

    - name: Run Black formatting check
      run: |
        echo "Checking code formatting with Black..."
        # advisory by design: style/security report, not a gate
        black --check --diff . || echo "⚠️ Code formatting issues found. Run 'black .' to fix."

    - name: Run isort import sorting check
      run: |
        echo "Checking import sorting with isort..."
        # advisory by design: style/security report, not a gate
        isort --check-only --diff . || echo "⚠️ Import sorting issues found. Run 'isort .' to fix."

    - name: Run Flake8 linting
      run: |
        echo "Running flake8 linting..."
        # --ignore= clears .flake8's ignore list for THIS command only: it lists F821, and a
        # longer ignore prefix beats the shorter --select=F82 prefix, so undefined names
        # were never reported (#2441). pre-commit/local flake8 still read .flake8 unchanged.
        flake8 . --count --select=E9,F63,F7,F82 --ignore= --show-source --statistics

    - name: Run Bandit security check
      run: |
        echo "Running security checks with Bandit..."
        # advisory by design: style/security report, not a gate
        bandit -r . -f json -o bandit-results.json || echo "⚠️ Security issues found."

    - name: Upload Bandit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-results
        path: bandit-results.json

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      # merge_group excluded: SARIF uploaded for a temporary gh-readonly-queue ref would
      # open code-scanning alerts on a branch that is deleted minutes later (#2184).
      if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        sarif_file: 'trivy-results.sarif'

  validation:
    name: Basic Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install basic dependencies
      run: |
        pip install --upgrade pip
        # Install only what's needed for syntax validation
        pip install frappe-bench

    - name: Syntax validation
      run: |
        echo "Checking Python syntax..."
        # compileall recurses and exits non-zero on a syntax error. The old
        # `py_compile verenigingen/**/*.py || echo` compiled one directory level under sh
        # (no globstar) and swallowed the exit code (#2399).
        python -m compileall -q verenigingen

    - name: Import validation
      run: |
        echo "Checking import statements..."
        # Basic import checks without full Frappe environment
        python -c "
        import ast
        import os
        failed = False
        for root, dirs, files in os.walk('verenigingen'):
            for file in files:
                if file.endswith('.py'):
                    filepath = os.path.join(root, file)
                    try:
                        with open(filepath, 'r') as f:
                            ast.parse(f.read())
                        print(f'✓ {filepath}')
                    except SyntaxError as e:
                        print(f'✗ {filepath}: {e}')
                        failed = True
        if failed:
            raise SystemExit(1)
        "

    - name: Check JavaScript/JSON files
      run: |
        echo "Checking JSON files..."
        # `find -exec ... \;` exits 0 whatever the command did; xargs exits non-zero if any
        # invocation fails (#2399).
        find . -name "*.json" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m json.tool > /dev/null

        echo "Basic file structure validation..."
        ls -la verenigingen/
        [ -f "pyproject.toml" ] && echo "✓ pyproject.toml found" || echo "⚠️ pyproject.toml missing"
        [ -f "verenigingen/hooks.py" ] && echo "✓ hooks.py found" || echo "⚠️ hooks.py missing"

  api-security-audit:
    name: API Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run API Security Audit
      run: |
        echo "🔒 Running API Security Audit..."
        echo "Checking for unprotected @frappe.whitelist() endpoints in financial modules..."

        # Define high-risk patterns
        HIGH_RISK_PATTERNS="payment|sepa|invoice|financial|settlement|batch|mandate|sync|audit"

        # #1096: endpoints are found from the ast (a decorator on a function), not
        # from line text, so decorator-shaped text inside a string literal is not
        # counted. Scan roots (verenigingen/, scripts/) live in the script (#1076).
        python3 scripts/validation/api_security_audit.py audit

    - name: Generate Security Report
      if: always()
      run: |
        echo "📊 Generating API Security Report..."
        python3 scripts/validation/api_security_audit.py report

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-security-report
        path: api-security-report.json
        retention-days: 30

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check README and docs
      run: |
        echo "Checking documentation..."
        [ -f "README.md" ] && echo "✓ README.md found" || echo "⚠️ README.md missing"
        [ -d "docs" ] && echo "✓ docs directory found" || echo "⚠️ docs directory missing"

        echo "Checking for broken links in markdown files..."
        find . -name "*.md" -exec grep -l "http" {} \; | head -5

        echo "Documentation validation complete"
