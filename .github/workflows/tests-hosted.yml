name: Test Suite (GitHub Hosted)

# Alternative workflow for GitHub-hosted runners
# Use this if you don't have self-hosted runners with Frappe installed
# Note: This requires setting up Frappe in the workflow, which adds ~5-10min overhead

on:
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: 'Run full test suite (slow)'
        type: boolean
        default: false

# Cancel previous runs
concurrency:
  group: tests-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  setup-and-test:
    name: Setup Frappe & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_site
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-frappe-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-frappe-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            mariadb-client \
            libmariadb-dev \
            redis-tools \
            wkhtmltopdf \
            xvfb

      - name: Install Frappe Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation frappe-bench
          cd frappe-bench

          # Configure for test environment
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6380

      - name: Setup Site
        run: |
          cd frappe-bench
          bench new-site --db-root-password root --admin-password admin test.localhost
          bench --site test.localhost scheduler disable

      - name: Install ERPNext (dependency)
        run: |
          cd frappe-bench
          bench get-app erpnext --branch version-15
          bench --site test.localhost install-app erpnext
        continue-on-error: true

      - name: Install Verenigingen
        run: |
          cd frappe-bench
          # Link the checked out app
          ln -s ${{ github.workspace }} apps/verenigingen
          bench --site test.localhost install-app verenigingen

      - name: Run Critical Tests
        run: |
          cd frappe-bench
          bench --site test.localhost run-tests \
            --module verenigingen.tests.contracts \
            --failfast

      - name: Run Service Tests
        if: inputs.run_full_tests
        run: |
          cd frappe-bench
          bench --site test.localhost run-tests \
            --module verenigingen.tests.services

      - name: Run Integration Tests
        if: inputs.run_full_tests
        run: |
          cd frappe-bench
          bench --site test.localhost run-tests \
            --module verenigingen.tests.integration

  # Standalone validation (no Frappe needed)
  validation:
    name: Code Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install black isort flake8

      - name: Python Syntax Check
        run: |
          python -m py_compile $(find verenigingen -name "*.py" -type f)

      - name: Import Structure Validation
        run: |
          python -c "
          import ast
          import sys
          from pathlib import Path

          errors = []
          for py_file in Path('verenigingen').rglob('*.py'):
              try:
                  ast.parse(py_file.read_text())
              except SyntaxError as e:
                  errors.append(f'{py_file}: {e}')

          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'✓ All {len(list(Path(\"verenigingen\").rglob(\"*.py\")))} Python files valid')
          "

      - name: Contract Test Validation (No Frappe)
        run: |
          # Validate that contract tests can at least be parsed
          python -c "
          import ast
          from pathlib import Path

          contract_tests = list(Path('verenigingen/tests').rglob('*contract*.py'))
          print(f'Found {len(contract_tests)} contract test files')
          for f in contract_tests:
              ast.parse(f.read_text())
              print(f'  ✓ {f.name}')
          "
